    <section class="section" id="capital">
      <div class="section-label">06 · CAPITAL PATH & STRIPE</div>
      <h2>从 5 亿到潜在 100 亿美元：市场在给“AI 结算层”定价</h2>
      <div class="capital-strip">
        <div class="capital-point"><small>June 2025</small><strong>$0.5B</strong><span>约 5 亿美元估值<br>合计融资 4,000 万美元</span></div>
        <div class="capital-jump">2.6×</div>
        <div class="capital-point"><small>May 2026</small><strong>$1.3B</strong><span>媒体报道投后估值<br>Series B 1.13 亿美元</span></div>
        <div class="capital-jump">7.7×</div>
        <div class="capital-point"><small>July 2026 · Talks</small><strong>~$10B</strong><span>潜在收购讨论价<br>尚未形成交易</span></div>
      </div>
      <div class="timeline">
        <div class="timeline-item"><time>Early 2023</time><b>OpenRouter 启动</b><p>CEO兼联合创始人 Alex Atallah 曾联合创办 NFT 市场 OpenSea；再次选择“开放市场”式商业模型。</p></div>
        <div class="timeline-item"><time>June 2025</time><b>种子轮与 Series A 合计 4,000 万美元</b><p>a16z 与 Menlo Ventures 分别领投相关轮次，Sequoia 参与；《华尔街日报》报道估值约 5 亿美元。</p></div>
        <div class="timeline-item"><time>May 2026</time><b>1.13 亿美元 Series B</b><p>CapitalG 领投，NVentures、ServiceNow Ventures、MongoDB Ventures、Snowflake Ventures、Databricks Ventures 等加入；媒体报道投后估值约 13 亿美元。</p></div>
        <div class="timeline-item"><time>July 2026</time><b>Stripe 洽谈收购，价格或约 100 亿美元</b><p>《华尔街日报》称交易可能较快公布，也可能谈判破裂或出现其他买方。本文截至 7月26日未见双方正式交易公告。</p></div>
      </div>

      <h3>为什么 Stripe 有理由买，而不只是投资</h3>
      <div class="stripe-panel">
        <div class="stripe-fact">
          <h3>已经发生的产品整合</h3>
          <ul>
            <li>OpenRouter 是 Stripe Projects 的合作 Provider。</li>
            <li>开发者可用一条 CLI 命令创建或关联 OpenRouter 账户、生成 API Key 并同步环境变量。</li>
            <li>Stripe Projects 可统一管理 AI、数据库、托管、认证等服务的账单与凭证。</li>
            <li>付费计划通过 Stripe 的 Shared Payment Token 授权 Provider 扣款，底层卡号不直接共享。</li>
          </ul>
        </div>
        <div class="stripe-inference">
          <h3>Kerwin 的战略推演</h3>
          <ul>
            <li><b>把 Token 变成新的支付品类。</b> Stripe 可同时掌握企业软件服务采购与模型调用支出。</li>
            <li><b>让 Agent 成为客户。</b> Agent 能自动开户、获取凭证、购买 Credits、调用模型并控制预算。</li>
            <li><b>获得 AI 消费总账。</b> OpenRouter 的模型、Provider、任务与费用数据可补足 Stripe 的支付网络视角。</li>
            <li><b>从支付底座进入开发者控制面。</b> 交易价值取决于未来分发权，而非当前 5,000 万美元年化收入。</li>
          </ul>
        </div>
      </div>
      <div class="risk-band">
        <h3>约 100 亿美元意味着什么</h3>
        <ul>
          <li>相对约 13 亿美元上一轮估值，潜在价格约为 <b>7.7 倍</b>。</li>
          <li>相对约 5,000 万美元媒体报道年化收入，潜在价格约为 <b>200 倍</b>。</li>
          <li>如果收购落地，Stripe 必须让 OpenRouter 成为 Agent 经济的默认采购与结算层，单靠现有平台费难以解释价格。</li>
          <li>收购也可能削弱“中立路由”形象，让 Provider 和大客户担心 Stripe 掌握过多价格、需求与交易数据。</li>
        </ul>
      </div>
    </section>

    <section class="section" id="moat">
      <div class="section-label">07 · MOAT SCORECARD</div>
      <h2>护城河在哪里：最强是市场流动性，最弱是接口本身</h2>
      <div class="moat-grid">
        <div class="moat-row"><b>供给广度与上新速度</b><span class="moat-score">●●●●○ 4/5</span><span>400+ 模型、70+ Provider 与新模型快速上线，降低开发者搜索成本；但竞争者也可扩展目录。</span></div>
        <div class="moat-row"><b>需求聚合与开发者心智</b><span class="moat-score">●●●●○ 4/5</span><span>10M+ 用户、250K+ 应用与公开榜单形成自然入口。越多真实调用，越能吸引模型和 Provider。</span></div>
        <div class="moat-row"><b>统一钱包与结算</b><span class="moat-score">●●●●○ 4/5</span><span>Credits、统一合同、税务与账单减少多供应商摩擦；企业财务流程一旦接入，切换成本高于单纯 API。</span></div>
        <div class="moat-row"><b>运行数据与价格发现</b><span class="moat-score">●●●●○ 4/5</span><span>跨模型、Provider、任务、延迟与留存的数据有助于路由和研究；数据优势取决于样本代表性与合规边界。</span></div>
        <div class="moat-row"><b>企业治理与可靠性</b><span class="moat-score">●●●○○ 3/5</span><span>ZDR、区域路由、预算、SSO、SLA 和故障切换正在补齐，但 AWS、Cloudflare、Portkey 等更强于既有企业控制面。</span></div>
        <div class="moat-row"><b>OpenAI 兼容 API</b><span class="moat-score">●●○○○ 2/5</span><span>开发者体验优秀，也意味着迁移相对容易。统一接口已经成为行业标准，不构成单独的长期壁垒。</span></div>
      </div>
      <div class="risk-band">
        <h3>网络效应成立需要三个条件</h3>
        <ul>
          <li>更多流量必须提升路由、可靠性或供给议价，而不只是增加低价与免费 Token。</li>
          <li>应用愿意把主要账单留在平台，而非只用 OpenRouter 做测试，生产后转向原厂直连。</li>
          <li>Provider 和模型原厂继续接受中立分发，不通过独家、限价或接口限制绕开平台。</li>
        </ul>
      </div>
    </section>

    <section class="section" id="competition">
      <div class="section-label">08 · COMPETITIVE LANDSCAPE</div>
      <h2>真正的竞争不只来自另一个 OpenRouter</h2>
      <div class="table-wrap">
        <table>
          <thead><tr><th>平台／路径</th><th>核心定位</th><th>最强优势</th><th>对 OpenRouter 的威胁</th><th>主要短板</th></tr></thead>
          <tbody>
            <tr><td><b>OpenRouter</b></td><td>独立模型市场、统一 Credits 与智能路由</td><td>目录广度、开发者流量、真实使用榜单、跨 Provider 结算</td><td>基准对象</td><td>5.5% 平台费、切换容易、企业深度仍在建设</td></tr>
            <tr><td><b>Vercel AI Gateway</b></td><td>开发与部署平台内置的多模型网关</td><td>数百模型、零 Token 加价、无平台费、AI SDK 与前端开发生态</td><td>直接以零费率争夺 AI 原生应用和 Agent 开发者</td><td>市场数据与独立模型发现心智弱于 OpenRouter</td></tr>
            <tr><td><b>AWS Bedrock</b></td><td>超大云中的企业模型市场与托管服务</td><td>企业采购、安全、云承诺额、私有模型、Agents 与 Guardrails</td><td>把多模型访问打包进客户已有 AWS 合同</td><td>中立性、长尾模型速度和跨云体验较弱</td></tr>
            <tr><td><b>Cloudflare AI Gateway</b></td><td>边缘网络上的 AI 控制面</td><td>全球网络、缓存、安全、DLP、可观测性、动态路由与统一账单</td><td>可把 AI 网关并入现有网络与安全采购</td><td>开发者模型市场和应用发现仍非核心心智</td></tr>
            <tr><td><b>Portkey / LiteLLM</b></td><td>企业 AI 网关或可自托管代理</td><td>治理、预算、观测、条件路由、自托管与数据控制</td><td>大型企业可保留自己的 Provider 合同和控制面</td><td>缺少同等规模的统一钱包、公开需求与模型市场</td></tr>
            <tr><td><b>原厂直连</b></td><td>OpenAI、Anthropic、Google、模型原厂 API</td><td>最早能力、完整功能、直接支持和潜在价格优惠</td><td>高价值工作负载稳定后，客户可能绕过中间层</td><td>供应商锁定、故障半径和多模型管理成本较高</td></tr>
          </tbody>
        </table>
      </div>
      <p class="micro">Together AI 与 Fireworks AI 更接近上游推理 Provider，同时也可直接向开发者销售 API，因此既是 OpenRouter 的供给方，也是相邻竞争者。一个应用可以通过 OpenRouter 调用其端点，也可以与其直接签约。</p>
    </section>

    <section class="section" id="public-markets">
      <div class="section-label">09 · CAPITAL-MARKET MAPPING</div>
      <h2>资本市场映射：没有上市纯标的，更多是“卖铲、建云、做控制面”</h2>
      <div class="table-wrap">
        <table>
          <thead><tr><th>层次</th><th>代表公司／证券</th><th>与 OpenRouter 的关系</th><th>可观察的投资信号</th><th>边界</th></tr></thead>
          <tbody>
            <tr><td><b>私有核心资产</b></td><td>OpenRouter、Stripe、Together AI、Fireworks AI、Vercel、Databricks</td><td>分发、支付、推理和 Agent 开发的核心未上市公司</td><td>融资估值、年化收入、并购、企业客户与 Token 规模</td><td>不存在公开市场直接复制 OpenRouter 回报的纯标的</td></tr>
            <tr><td><b>GPU 与推理硬件</b></td><td>NVIDIA（NVDA）、AMD（AMD）</td><td>开放模型被全球部署，最终增加推理 GPU 需求；NVentures 是 OpenRouter 投资者</td><td>推理占比、Token 成本、GPU 利用率、云端推理收入</td><td>OpenRouter 流量只是全行业需求的一部分</td></tr>
            <tr><td><b>云与模型市场</b></td><td>Alphabet（GOOGL）、Amazon（AMZN）、Microsoft（MSFT）</td><td>既提供模型或云端推理，也是独立路由层的竞争者；CapitalG 领投 OpenRouter B轮</td><td>多模型收入、AI 云增速、模型选择与企业迁移</td><td>CVC 投资收益对超大市值公司财务通常不重大</td></tr>
            <tr><td><b>网络控制面</b></td><td>Cloudflare（NET）</td><td>AI Gateway 以边缘、安全、缓存、动态路由和统一账单竞争</td><td>AI Gateway 客户、开发者采用、推理流量与安全附加值</td><td>尚需验证 AI 网关能否成为实质收入驱动</td></tr>
            <tr><td><b>企业数据与软件</b></td><td>ServiceNow（NOW）、MongoDB（MDB）、Snowflake（SNOW）</td><td>其 Ventures 参与 OpenRouter B轮，反映企业多模型治理与数据栈需求</td><td>Agent 收入、AI 工作负载、数据调用、企业推理支出</td><td>战略投资代表方向判断，不等同 OpenRouter 业务并表</td></tr>
          </tbody>
        </table>
      </div>
      <div class="investment">
        <h3>Kerwin投顾解读</h3>
        <ol>
          <li><b>OpenRouter 最重要的投资启发，是价值池正在横向扩散。</b>模型能力越多、价格下降越快，统一路由、推理效率、企业治理和分发入口越有价值。</li>
          <li><b>中国开放权重模型不必在海外建立完整销售团队，也能形成全球 Token 使用。</b>但收入可能更多落在 GPU、推理 Provider、路由平台和下游应用，而不是模型原厂本身。</li>
          <li><b>约 100 亿美元是战略终局价，不是当前利润价。</b>它押注 OpenRouter 成为 Agent 采购模型与结算 Token 的默认入口；一旦费率被压到接近零，估值逻辑必须转向企业 SaaS、数据和支付协同。</li>
          <li><b>公开市场上应观察推理总量的受益者，而非把某个战略投资者当作 OpenRouter 替代品。</b>NVDA、云平台、网络与数据软件的逻辑来自全行业推理扩张，OpenRouter只是领先观测窗口。</li>
        </ol>
      </div>
    </section>

    <section class="section" id="monitor">
      <div class="section-label">10 · SCENARIOS, FALSIFICATION & MONITORING</div>
      <h2>未来三种路径，以及怎样判断故事正在失效</h2>
      <div class="scenario"><b>路径 A｜保持独立，成长为中立推理市场</b><span>月度 Token、付费客户和企业收入同步增长；平台继续扩展路由、数据政策、工作区和多模态。中立性与两边市场网络效应最完整。</span></div>
      <div class="scenario"><b>路径 B｜Stripe 以高战略溢价收购</b><span>OpenRouter 被嵌入 Stripe Projects、Agent 支付与服务采购体系。分发能力增强，但模型与 Provider 需要重新评估平台中立性和数据边界。</span></div>
      <div class="scenario risk"><b>路径 C｜费率压缩与生产流量绕行</b><span>Vercel、Cloudflare、云平台和自托管网关把基础路由价格压向零；客户在 OpenRouter 测试模型后改为直连，Token 增长却难以转化为平台收入。</span></div>
