<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900"><rect width="1600" height="900" fill="#fff8ee"/><style>.t{font:700 54px Georgia;fill:#103f35}.h{font:700 28px Arial;fill:#103f35}.p{font:500 21px Arial;fill:#262220}.b{fill:#fffdf8;stroke:#cdbfb3;stroke-width:2}.g{fill:#dce8e2;stroke:#cdbfb3;stroke-width:2}.r{fill:#f4dfd8;stroke:#cdbfb3;stroke-width:2}</style><text x="55" y="78" class="t">图6｜能源如何转化为主权金融权力</text><text x="58" y="120" class="p">Energy to Sovereign Money · 资源必须经过制度才能变成购买力</text><text x="80" y="250" class="p">资源/出口 → 计价货币 → 支付通道 → 银行清算 → 外汇储备 → 主权基金 → 资产再循环 → 主权购买力</text><line x1="90" y1="300" x2="1500" y2="300" stroke="#103f35" stroke-width="8"/><rect x="70" y="430" width="450" height="250" rx="20" class="g"/><text x="105" y="485" class="h">海湾模式｜Gulf Model</text><text x="105" y="545" class="p">稳定出口 → 美元收入</text><text x="105" y="595" class="p">外储 / SWF → 全球资产</text><rect x="575" y="430" width="450" height="250" rx="20" class="r"/><text x="610" y="485" class="h">受制裁模式｜Sanctioned</text><text x="610" y="545" class="p">折价销售 → 替代支付</text><text x="610" y="595" class="p">受限清算 → 有限再投资</text><rect x="1080" y="430" width="450" height="250" rx="20" class="b"/><text x="1115" y="485" class="h">超级买方｜Buyer Power</text><text x="1115" y="545" class="p">规模 + 多支付冗余</text><text x="1115" y="595" class="p">长期议价 + 规则影响力</text><text x="190" y="770" class="h">Monetization → Convertibility → Asset Recycling → Financial Sovereignty</text><rect y="850" width="1600" height="50" fill="#103f35"/></svg>