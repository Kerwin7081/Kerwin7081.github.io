<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900"><rect width="1600" height="900" fill="#fff8ee"/><style>.t{font:700 54px Georgia;fill:#103f35}.h{font:700 28px Arial;fill:#103f35}.p{font:500 21px Arial;fill:#262220}.b{fill:#fffdf8;stroke:#cdbfb3;stroke-width:2}.r{fill:#f4dfd8;stroke:#cdbfb3;stroke-width:2}</style><text x="55" y="78" class="t">图5｜主权能源续航期</text><text x="58" y="120" class="p">Sovereign Energy Runway · 库存的价值不是桶数，而是时间</text><rect x="200" y="190" width="1200" height="125" rx="22" class="r"/><text x="300" y="267" font-family="Georgia" font-size="50" font-weight="700" fill="#9f332b">SER = Usable Inventory ÷ Residual Daily Supply Gap</text><rect x="70" y="375" width="340" height="310" rx="20" class="b"/><text x="105" y="425" class="h">中国｜China</text><text x="105" y="485" class="p">多源进口 + 大库存</text><text x="105" y="535" class="p">路线切换 + 国内供给</text><rect x="445" y="375" width="340" height="310" rx="20" class="b"/><text x="480" y="425" class="h">美国｜United States</text><text x="480" y="485" class="p">本土资源 + 加拿大</text><text x="480" y="535" class="p">产量 + SPR</text><rect x="820" y="375" width="340" height="310" rx="20" class="b"/><text x="855" y="425" class="h">日本｜Japan</text><text x="855" y="485" class="p">资源弱 + 高库存</text><text x="855" y="535" class="p">海运替代 + 战略库存</text><rect x="1195" y="375" width="335" height="310" rx="20" class="b"/><text x="1230" y="425" class="h">欧洲｜Europe</text><text x="1230" y="485" class="p">储气 + 挪威 + LNG</text><text x="1230" y="535" class="p">多来源再气化</text><rect x="70" y="725" width="1460" height="75" rx="16" class="r"/><text x="110" y="775" class="h">只有当续航期 ＞ 供应链重构时间，库存才真正变成主权缓冲。</text><rect y="850" width="1600" height="50" fill="#103f35"/></svg>