<svg xmlns="http://www.w3.org/2000/svg" width="1491" height="1055" viewBox="0 0 1491 1055"><rect width="1491" height="1055" fill="#fffaf2"/><style>.t{font-family:Georgia,'Noto Serif CJK SC',serif;fill:#103f35}.s{font-family:Arial,'Noto Sans CJK SC',sans-serif;fill:#262220}.m{fill:#746b65}.g{fill:#103f35}.r{fill:#9f332b}.b{fill:#145b92}.p{fill:#f3eadf;stroke:#cdbfb3;stroke-width:2}.ln{stroke:#103f35;stroke-width:7;fill:none;marker-end:url(#a)}.lr{stroke:#9f332b;stroke-width:7;fill:none;marker-end:url(#ar)}.lb{stroke:#1976d2;stroke-width:6;stroke-dasharray:14 10;fill:none;marker-end:url(#ab)}.h{font-weight:700}.small{font-size:25px}.mid{font-size:32px}.big{font-size:54px}</style><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10z" fill="#103f35"/></marker><marker id="ar" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10z" fill="#9f332b"/></marker><marker id="ab" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10z" fill="#1976d2"/></marker></defs><text x="46" y="78" class="t big h">图1｜全球物理能源总图</text><text x="48" y="126" class="s mid">GLOBAL PHYSICAL ENERGY MAP · 资源 → 通道 → 消费中心 → 库存缓冲</text><line x1="48" y1="151" x2="1443" y2="151" stroke="#103f35" stroke-width="3"/>
<rect x="55" y="205" width="330" height="170" rx="12" class="p"/><text x="85" y="255" class="t mid h">大西洋能源体系</text><text x="85" y="300" class="s small">US · Canada · Venezuela</text><text x="85" y="338" class="s small">Brazil · Guyana → Europe / Asia</text>
<rect x="580" y="205" width="330" height="170" rx="12" fill="#f8e4df" stroke="#9f332b" stroke-width="2"/><text x="610" y="255" class="r mid h">中东—霍尔木兹</text><text x="610" y="300" class="s small">Gulf → Hormuz → Indian Ocean</text><text x="610" y="338" class="s small">→ Asia</text>
