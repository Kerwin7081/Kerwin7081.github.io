<rect x="140" y="770" width="1210" height="145" rx="14" fill="#f6e9e4" stroke="#9f332b" stroke-width="2"/><text x="185" y="825" class="r mid h">库存缓冲层 · INVENTORY BUFFER</text><text x="185" y="875" class="s small">库存不是静态桶数，而是为供应链重构购买时间。</text><text x="185" y="915" class="t small h">核心：资源储量 ≠ 能源权力；可交付能力比名义产能更重要。</text><rect y="1008" width="1491" height="47" fill="#103f35"/><text x="48" y="1039" fill="#fffaf2" font-family="Arial" font-size="19" font-weight="700">KERWIN RESEARCH · GLOBAL ENERGY SOVEREIGNTY</text></svg>