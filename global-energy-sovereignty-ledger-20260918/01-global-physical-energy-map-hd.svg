<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#fff8ee"/><style>.t{font:700 54px Georgia,serif;fill:#103f35}.s{font:600 24px Arial,sans-serif;fill:#746b65}.h{font:700 28px Arial,sans-serif;fill:#103f35}.p{font:500 20px Arial,sans-serif;fill:#262220}.m{font:500 17px Arial,sans-serif;fill:#746b65}.box{fill:#fffdf8;stroke:#cdbfb3;stroke-width:2}.gp{fill:#dce8e2;stroke:#cdbfb3;stroke-width:2}.rp{fill:#f4dfd8;stroke:#cdbfb3;stroke-width:2}.ln{stroke:#103f35;stroke-width:7;fill:none}.rr{stroke:#9f332b;stroke-width:7;fill:none}</style><text x="55" y="78" class="t">图1｜全球物理能源总图</text><text x="58" y="120" class="s">Global Physical Energy Map · 从资源分布转向可交付能力</text><line x1="55" y1="145" x2="1545" y2="145" stroke="#103f35" stroke-width="3"/><rect x="70" y="190" width="360" height="170" rx="18" class="box"/><text x="100" y="235" class="h">大西洋能源体系</text><text x="100" y="280" class="p">US · Canada · Venezuela</text><text x="100" y="320" class="p">Brazil · Guyana · Argentina</text><rect x="620" y="190" width="360" height="170" rx="18" class="rp"/><text x="650" y="235" class="h">中东—霍尔木兹体系</text><text x="650" y="280" class="p">Saudi · Iran · Iraq · UAE · Qatar</text><rect x="1170" y="190" width="360" height="170" rx="18" class="box"/><text x="1200" y="235" class="h">欧亚陆路体系</text><text x="1200" y="280" class="p">Russia · Central Asia → China</text><path d="M430 275 C520 275 540 275 620 275" class="ln"/><path d="M980 275 C1060 275 1090 275 1170 275" class="ln"/><rect x="1170" y="500" width="360" height="150" rx="18" class="gp"/><text x="1200" y="545" class="h">北极能源走廊</text><text x="1200" y="590" class="p">Russian Arctic → NSR → Asia</text><rect x="620" y="500" width="360" height="150" rx="18" class="box"/><text x="650" y="545" class="h">亚洲消费中心</text><text x="650" y="590" class="p">China · India · Japan · Korea</text><path d="M800 360 L800 500" class="rr"/><rect x="70" y="700" width="1460" height="100" rx="16