<svg xmlns="http://www.w3.org/2000/svg" width="1491" height="1055" viewBox="0 0 1491 1055"><rect width="1491" height="1055" fill="#fffaf2"/><style>.t{font-family:Georgia,'Noto Serif CJK SC',serif;fill:#103f35}.s{font-family:Arial,'Noto Sans CJK SC',sans-serif;fill:#262220}.m{fill:#746b65}.g{fill:#103f35}.r{fill:#9f332b}.b{fill:#145b92}.p{fill:#f3eadf;stroke:#cdbfb3;stroke-width:2}.ln{stroke:#103f35;stroke-width:7;fill:none;marker-end:url(#a)}.lr{stroke:#9f332b;stroke-width:7;fill:none;marker-end:url(#ar)}.lb{stroke:#1976d2;stroke-width:6;stroke-dasharray:14 10;fill:none;marker-end:url(#ab)}.h{font-weight:700}.small{font-size:25px}.mid{font-size:32px}.big{font-size:54px}</style><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10z" fill="#103f35"/></marker><marker id="ar" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10z" fill="#9f332b"/></marker><marker id="ab" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10z" fill="#1976d2"/></marker></defs><text x="46" y="78" class="t big h">图5｜主权能源续航期</text><text x="48" y="126" class="s mid">SOVEREIGN ENERGY RUNWAY · 库存的价值不是桶数，而是供应链重构时间</text><line x1="48" y1="151" x2="1443" y2="151" stroke="#103f35" stroke-width="3"/>
<rect x="160" y="210" width="1170" height="145" rx="18" fill="#f8e4df" stroke="#9f332b" stroke-width="3"/><text x="235" y="305" class="r big h">SER = 可用库存 ÷ 剩余每日供给缺口</text>
<g class="s small"><rect x="55" y="430" width="320" height="350" rx="14" class="p"/><text x="90" y="485" class="t mid h">中国</text><text x="90" y="550">结构：多源进口 + 大库存</text><text x="90" y="610">缓冲：路线切换 + 国内供给</text><text x="90" y="670">瓶颈：关键海运节点</text>
<rect x="405" y="430" width="320" height="350" rx="14" class="p"/><text x="440" y="485" class="t mid h">美国</text><text x="440" y="550">结构：本土资源 + 加拿大</text><text x="440" y="610">缓冲：产量 + SPR</text><text x="440" y="670">瓶颈：炼化与成品油</text>
<rect x="755" y="430" width="320" height="350" rx="14" class="p"/><text x="790" y="485" class="t mid h">日本</text><text x="790" y="550">结构：资源弱 + 高库存</text><text x="790" y="610">缓冲：海运替代 + 战略库存</text><text x="790" y="670">瓶颈：进口依赖</text>
<rect x="1105" y="430" width="320" height="350" rx="14" class="p"/><text x="1140" y="485" class="t mid h">欧洲</text><text x="1140" y="550">结构：储气 + 挪威 + LNG</text><text x="1140" y="610">缓冲：多来源再气化</text><text x="1140" y="670">瓶颈：冬季提取能力</text></g>
<rect x="130" y="850" width="1230" height="95" rx="12" fill="#9f332b"/><text x="190" y="910" fill="#fffaf2" font-family="Arial" font-size="30" font-weight="700">只有当续航期 ＞ 重构时间，库存才真正变成主权缓冲。</text><rect y="1008" width="1491" height="47" fill="#103f35"/><text x="48" y="1039" fill="#fffaf2" font-family="Arial" font-size="19" font-weight="700">KERWIN RESEARCH · GLOBAL ENERGY SOVEREIGNTY</text></svg>