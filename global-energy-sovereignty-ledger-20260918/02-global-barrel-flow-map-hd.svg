<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#fff8ee"/><style>.t{font:700 54px Georgia,serif;fill:#103f35}.s{font:600 24px Arial,sans-serif;fill:#746b65}.h{font:700 28px Arial,sans-serif;fill:#103f35}.p{font:500 20px Arial,sans-serif;fill:#262220}.m{font:500 17px Arial,sans-serif;fill:#746b65}.box{fill:#fffdf8;stroke:#cdbfb3;stroke-width:2}.gp{fill:#dce8e2;stroke:#cdbfb3;stroke-width:2}.rp{fill:#f4dfd8;stroke:#cdbfb3;stroke-width:2}.ln{stroke:#103f35;stroke-width:7;fill:none}.rr{stroke:#9f332b;stroke-width:7;fill:none}</style><text x="55" y="78" class="t">图2｜全球原油流向图</text><text x="58" y="120" class="s">Global Barrel Flow Map · 正常状态 vs 压力状态</text><line x1="55" y1="145" x2="1545" y2="145" stroke="#103f35" stroke-width="3"/><text x="70" y="205" class="h">一桶油的主权价值 = 可生产 × 可出口 × 可运输 × 可炼化 × 可收款</text><rect x="70" y="255" width="700" height="410" rx="20" class="gp"/><text x="110" y="310" class="h">NORMAL FLOW｜正常状态</text><text x="110" y="375" class="p">Middle East → Hormuz → Asia</text><text x="110" y="425" class="p">Atlantic Barrel → Europe / Asia</text><text x="110" y="475" class="p">Russia → Pipeline + Pacific → China / India</text><text x="110" y="565" class="m">稳定航线 · 长途效率 · 全球平衡</text><rect x="830" y="255" width="700" height="410" rx="20" class="rp"/><text x="870" y="310" class="h">STRESS FLOW｜压力状态</text><text x="870" y="375" class="p">Hormuz impaired → rerouting</text><text x="870" y="425" class="p">Tanker-days ↑ · Insurance ↑</text><text x="870" y="475" class="p">Inventory draw · Refinery mismatch</text><text x="870" y="565" class="m">压力状态不能误判为永久结构</text><rect x="70" y="700" width="1460" height="100" rx="16" class="box"/><text x="105" y="745" class="h">核心判断</text><text x="300" y="745" class="p">替代路线 + 库存 = 韧性；可出口能力比名义产量更重要。</text><rect y="850" width="1600" height="50" fill="#103f35"/><text x="55" y="883" font-family="Arial" font-size="18" font-weight="700" fill="#fff8ee">KERWIN RESEARCH · ENERGY SOVEREIGNTY LEDGER</text></svg>