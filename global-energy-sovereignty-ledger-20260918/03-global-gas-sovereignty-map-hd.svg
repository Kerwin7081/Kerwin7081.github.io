<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#fff8ee"/><style>.t{font:700 54px Georgia,serif;fill:#103f35}.s{font:600 24px Arial,sans-serif;fill:#746b65}.h{font:700 28px Arial,sans-serif;fill:#103f35}.p{font:500 20px Arial,sans-serif;fill:#262220}.m{font:500 17px Arial,sans-serif;fill:#746b65}.box{fill:#fffdf8;stroke:#cdbfb3;stroke-width:2}.gp{fill:#dce8e2;stroke:#cdbfb3;stroke-width:2}.rp{fill:#f4dfd8;stroke:#cdbfb3;stroke-width:2}.ln{stroke:#103f35;stroke-width:7;fill:none}.rr{stroke:#9f332b;stroke-width:7;fill:none}</style><text x="55" y="78" class="t">图3｜全球天然气主权地图</text><text x="58" y="120" class="s">Global Gas Sovereignty Map · 管道绑定，LNG提供选择权</text><line x1="55" y1="145" x2="1545" y2="145" stroke="#103f35" stroke-width="3"/><text x="70" y="205" class="h">天然气主权 = 资源 + 管道 / 液化 + 船队 + 再气化 + 储气</text><rect x="70" y="250" width="700" height="440" rx="20" class="rp"/><text x="110" y="305" class="h">PIPELINE GAS｜管道天然气</text><text x="115" y="390" class="p">气田 → 管道 → 边境节点 → 终端市场</text><text x="115" y="465" class="p">Russia → China · Central Asia → China</text><text x="115" y="515" class="p">Norway → Europe</text><text x="115" y="600" class="m">长期合同 + 固定路径 = 深度绑定</text><rect x="830" y="250" width="700" height="440" rx="20" class="gp"/><text x="870" y="305" class="h">LNG｜液化天然气</text><text x="875" y="390" class="p">气田 → 液化厂 → LNG船 → 再气化 → 终端</text><text x="875" y="465" class="p">U.S. · Qatar · Australia → Global Market</text><text x="875" y="550" class="m">目的地灵活 = Optionality（选择权）</text><rect x="70" y="730" width="1460" height="70" rx="14" class="box"/><text x="105" y="775" class="p">管道 = 绑定　｜　LNG = 选择权　｜　储气 = 时间缓冲</text><rect y="850" width="1600" height="50" fill="#103f35"/><text x="55" y="883" font-family="Arial" font-size="18" font-weight="700" fill="#fff8ee">KERWIN RESEARCH · ENERGY SOVEREIGNTY LEDGER</text></svg>