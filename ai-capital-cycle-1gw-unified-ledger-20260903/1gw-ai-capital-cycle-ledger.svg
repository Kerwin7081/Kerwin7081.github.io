<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">1GW AI Capital Cycle统一总账本</title><desc id="desc">从发电资本、AI Factory资本到Compute、Model与Agent经济价值的三层统一账本。</desc><rect width="1600" height="900" fill="#fff1e5"/><rect x="48" y="42" width="1504" height="816" fill="#fffaf5" stroke="#103f35" stroke-width="2"/><text x="86" y="102" font-family="Georgia,Times New Roman,serif" font-weight="700" font-size="47" fill="#262220">1GW AI Capital Cycle统一总账本</text><text x="86" y="145" font-family="Arial,Microsoft YaHei,sans-serif" font-size="24" fill="#103f35">从天然气、电力到 Token、Agent 与经济价值｜三张账本，不做错误加法</text><text x="88" y="222" font-family="Arial,Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#9a5c38">01  CAPITAL / GW｜资本账本</text><line x1="88" y1="236" x2="1510" y2="236" stroke="#cdbfb3"/><g font-family="Arial,Microsoft YaHei,sans-serif"><rect x="88" y="260" width="260" height="116" fill="#f7e7d8" stroke="#cdbfb3"/><text x="108" y="292" font-size="17" font-weight="700" fill="#103f35">Natural Gas Generation</text><text x="108" y="333" font-family="Georgia,serif" font-size="31" font-weight="700" fill="#262220">$1.52B / GW</text><text x="108" y="358" font-size="13" fill="#746b65">EIA 2024 · gas ICE installed cost</text><text x="365" y="326" font-size="26" fill="#968b83">→</text><rect x="402" y="260" width="260" height="116" fill="#fff" stroke="#cdbfb3"/><text x="422" y="292" font-size="17" font-weight="700" fill="#103f35">LPS / Shell / Power / Cooling</text><text x="422" y="333" font-family="Georgia,serif" font-size="31" font-weight="700" fill="#262220">$15–18B / GW</text><text x="422" y="358" font-size="13" fill="#746b65">Kerwin working estimate · scope-dependent</text><text x="679" y="326" font-size="26" fill="#968b83">→</text><rect x="716" y="260" width="345" height="116" fill="#fff" stroke="#cdbfb3"/><text x="736" y="292" font-size="17" font-weight="700" fill="#103f35">GPU / XPU / Network Content</text><text x="736" y="333" font-family="Georgia,serif" font-size="31" font-weight="700" fill="#262220">$20–40B / GW</text><text x="736" y="358" font-size="13" fill="#746b65">Broadcom $20–30B · NVIDIA Rubin $40B opportunity</text><text x="1078" y="326" font-size="26" fill="#968b83">→</text><rect x="1116" y="260" width="394" height="116" fill="#103f35"/><text x="1138" y="292" font-size="17" font-weight="700" fill="#fffaf5">Full AI Factory Capital</text><text x="1138" y="333" font-family="Georgia,serif" font-size="34" font-weight="700" fill="#fff">$50–60B / GW</text><text x="1138" y="358" font-size="13" fill="#dce8e2">Kerwin underwriting range · NOT additive supplier revenue</text></g><text x="88" y="438" font-family="Arial,Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#9a5c38">02  ANNUAL REVENUE TOUCHPOINTS / GW｜收入账本</text><line x1="88" y1="452" x2="1510" y2="452" stroke="#cdbfb3"/><g font-family="Arial,Microsoft YaHei,sans-serif"><rect x="88" y="476" width="300" height="122" fill="#fff" stroke="#cdbfb3"/><text x="110" y="508" font-size="17" font-weight="700" fill="#103f35">Electricity sale equivalent</text><text x="110" y="551" font-family="Georgia,serif" font-size="32" font-weight="700" fill="#262220">≈ $0.8B / year</text><text x="110" y="578" font-size="13" fill="#746b65">8.76TWh × 9.17¢/kWh · price benchmark</text><text x="405" y="544" font-size="26" fill="#968b83">→</text><rect x="442" y="476" width="300" height="122" fill="#fff" stroke="#cdbfb3"/><text x="464" y="508" font-size="17" font-weight="700" fill="#103f35">Cloud / NeoCloud</text><text x="464" y="551" font-family="Georgia,serif" font-size="32" font-weight="700" fill="#262220">$20–30B / year</text><text x="464" y="578" font-size="13" fill="#746b65">Kerwin underwriting range · utilization-sensitive</text><text x="759" y="544" font-size="26" fill="#968b83">→</text><rect x="796" y="476" width="354" height="122" fill="#fff" stroke="#cdbfb3"/><text x="818" y="508" font-size="17" font-weight="700" fill="#103f35">Model / Agent Platform</text><text x="818" y="542" font-family="Georgia,serif" font-size="27" font-weight="700" fill="#262220">$30B anchor</text><text x="818" y="570" font-family="Georgia,serif" font-size="22" font-weight="700" fill="#103f35">→ $75B adoption case</text><text x="818" y="590" font-size="11" fill="#746b65">Broadcom management anchor → Kerwin adoption scenario</text><rect x="1178" y="476" width="332" height="122" fill="#f7e7d8" stroke="#9a5c38" stroke-width="2"/><text x="1200" y="507" font-size="16" font-weight="700" fill="#9f332b">口径纠偏</text><text x="1200" y="538" font-size="16" font-weight="700" fill="#262220">Broadcom $30B ARR/GW</text><text x="1200" y="563" font-size="14" fill="#262220">= 模型公司货币化口径</text><text x="1200" y="585" font-size="13" fill="#746b65">≠ Cloud / NeoCloud 租赁收入</text></g><text x="88" y="660" font-family="Arial,Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#9a5c38">03  ECONOMIC VALUE｜价值账本</text><line x1="88" y1="674" x2="1510" y2="674" stroke="#cdbfb3"/><g font-family="Arial,Microsoft YaHei,sans-serif"><rect x="88" y="698" width="334" height="102" fill="#103f35"/><text x="110" y="728" font-size="16" font-weight="700" fill="#fffaf5">$75B AI Spend / GW·year</text><text x="110" y="765" font-family="Georgia,serif" font-size="25" fill="#fff">× Agent Value Multiple</text><text x="110" y="787" font-size="12" fill="#dce8e2">quality-adjusted human-equivalent work / total AI cost</text><text x="442" y="757" font-size="28" fill="#968b83">→</text><rect x="488" y="698" width="201" height="102" fill="#fff" stroke="#cdbfb3"/><text x="508" y="730" font-size="15" fill="#746b65">1.5×</text><text x="508" y="770" font-family="Georgia,serif" font-size="28" font-weight="700" fill="#262220">$112.5B</text><rect x="699" y="698" width="201" height="102" fill="#fff" stroke="#cdbfb3"/><text x="719" y="730" font-size="15" fill="#746b65">2×</text><text x="719" y="770" font-family="Georgia,serif" font-size="28" font-weight="700" fill="#262220">$150B</text><rect x="910" y="698" width="201" height="102" fill="#fff" stroke="#cdbfb3"/><text x="930" y="730" font-size="15" fill="#746b65">3×</text><text x="930" y="770" font-family="Georgia,serif" font-size="28" font-weight="700" fill="#262220">$225B</text><rect x="1121" y="698" width="201" height="102" fill="#fff" stroke="#cdbfb3"/><text x="1141" y="730" font-size="15" fill="#746b65">5×</text><text x="1141" y="770" font-family="Georgia,serif" font-size="28" font-weight="700" fill="#262220">$375B</text><rect x="1332" y="698" width="178" height="102" fill="#f7e7d8" stroke="#cdbfb3"/><text x="1350" y="731" font-size="14" font-weight="700" fill="#103f35">最后问号</text><text x="1350" y="760" font-family="Georgia,serif" font-size="21" font-weight="700" fill="#262220">AVM = ?</text><text x="1350" y="784" font-size="11" fill="#746b65">需企业案例持续验证</text></g><text x="88" y="838" font-family="Arial,Microsoft YaHei,sans-serif" font-size="14" fill="#746b65">Revenue touchpoints ≠ GDP · Supplier content ≠ CAPEX · Human-equivalent work value ≠ GDP one-for-one · 2026-09-03 HKT</text></svg>