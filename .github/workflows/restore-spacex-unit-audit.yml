name: Restore SpaceX page and apply unit audit

on:
  push:
    paths:
      - '.github/workflows/restore-spacex-unit-audit.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore validated page and apply minimal corrections
        shell: bash
        run: |
          git show 186e7d4c05756650e5ec51b584c463c033017f73:spacex-new-beginning-20260805/index.html > spacex-new-beginning-20260805/index.html
          python3 - <<'PY'
          from pathlib import Path

          path = Path('spacex-new-beginning-20260805/index.html')
          html = path.read_text(encoding='utf-8')

          old_metric = '<div><strong>$1.600B</strong><span>电话会披露的Colossus算力租赁收入，约占AI收入62%</span></div>'
          new_metric = '<div><strong>$1.600B</strong><span>AI基础设施收入同比增加额，约占当季AI收入62%</span></div>'

          old_para = 'AI收入包括X广告、X与Grok订阅、数据授权、Grok API和云服务。Q2新增收入主要来自AI基础设施合同，电话会披露Colossus I与II的初期算力租赁收入约16亿美元，意味着外部算力服务已成为最大单项收入来源。'
          new_para = 'AI收入包括X广告、X与Grok订阅、数据授权、Grok API和云服务。10-Q披露，Q2 AI基础设施收入同比增加16亿美元，主要由于公司开始向客户提供云服务；电话会进一步将增量与Colossus I和II的云托管合同联系起来。该16亿美元是同比增加额，不应误读为全部Colossus收入。'

          table_marker = '        <div class="table-wrap" style="margin-top:16px">'
          unit_note = '        <div class="math-note"><b>单位说明：</b>SpaceX 10-Q财务报表原始单位为“百万美元（$M）”。本页财务数字统一换算为“十亿美元（$B）”，其中 <b>$1B = $1,000M = 10亿美元</b>；中文正文使用“亿美元”时按同一口径换算。</div>\n'

          assert html.count(old_metric) == 1, 'old metric wording not found exactly once'
          assert html.count(old_para) == 1, 'old paragraph wording not found exactly once'
          assert html.count(table_marker) == 1, 'financial table marker not found exactly once'
          assert '单位说明：' not in html, 'unit note already present unexpectedly'

          html = html.replace(old_metric, new_metric)
          html = html.replace(old_para, new_para)
          html = html.replace(table_marker, unit_note + table_marker)

          assert html.count('$7.814B') >= 1
          assert html.count('$3.538B') >= 1
          assert html.count('$18.369B') >= 1
          assert html.count('$100.009B') >= 1
          assert html.count('$15.828B') >= 1
          assert html.count('AI基础设施收入同比增加额') == 1
          assert html.count('单位说明：') == 1

          path.write_text(html, encoding='utf-8')
          PY

      - name: Remove one-time workflow
        run: rm .github/workflows/restore-spacex-unit-audit.yml

      - name: Commit restored page
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add spacex-new-beginning-20260805/index.html .github/workflows/restore-spacex-unit-audit.yml
          git commit -m 'restore SpaceX page and finalize financial unit audit'
          git push
