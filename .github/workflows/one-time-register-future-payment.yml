name: One-time register Future Payment topic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-register-future-payment.yml'

permissions:
  contents: write

jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Register research topic
        shell: python
        run: |
          import json
          from pathlib import Path

          path = Path('registry.json')
          items = json.loads(path.read_text(encoding='utf-8'))
          slug = 'future-payment-infrastructure-stablecoin-agentic-commerce-20260809'
          if not any(item.get('slug') == slug for item in items):
              items.insert(0, {
                  'slug': slug,
                  'title': '全新支付基础设施：从 Stablecoin Card 到 Agent Payment',
                  'date': '2026年8月9日',
                  'deck': '从A16z稳定币卡数据出发，建立Money、Blockchain Rails、Payment OS、Visa/Mastercard受理与信任、x402/MPP机器支付、Cloudflare Internet Control Plane六层框架，并映射CRCL、COIN、V、MA、NET的价值捕获、预期差与证伪条件。',
                  'tag': 'Global Financial Infrastructure & Market Structure',
                  'category': 'Global Financial Infrastructure & Market Structure',
                  'source': 'enya',
                  'homepage_approved': False,
                  'published_at': '2026-08-09T20:13:00+08:00'
              })
              path.write_text(json.dumps(items, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
      - name: Commit registry update
        shell: bash
        run: |
          if git diff --quiet -- registry.json; then
            echo 'Registry already current.'
            exit 0
          fi
          git config user.name 'kerwin-enya-registry-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add registry.json
          git commit -m 'Register Future Payment Infrastructure topic'
          git push
