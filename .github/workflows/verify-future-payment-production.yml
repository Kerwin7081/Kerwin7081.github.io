name: Verify Future Payment production

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/verify-trigger/**'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Visit production topic and homepage data
        shell: bash
        run: |
          set -euo pipefail
          PAGE='https://enyaclawd.com/future-payment-infrastructure-stablecoin-agentic-commerce-20260809/'
          HOME='https://enyaclawd.com/'
          REG='https://enyaclawd.com/registry.json'
          curl --retry 5 --retry-delay 5 --retry-all-errors -fsSL "$PAGE" -o /tmp/page.html
          curl --retry 5 --retry-delay 5 --retry-all-errors -fsSL "$HOME" -o /tmp/home.html
          curl --retry 5 --retry-delay 5 --retry-all-errors -fsSL "$REG" -o /tmp/registry.json
          grep -F '发布日期</b> 2026-08-10' /tmp/page.html
          grep -F 'KERWIN FOREWORD · 卷首语' /tmp/page.html
          grep -F 'Cloudflare（NYSE: NET）到底是什么？为什么会突然出现在支付产业链里？' /tmp/page.html
          grep -F '本专题的认识框架、判断边界与投资结论由 Kerwin 确定' /tmp/page.html
          grep -F 'kerwin-home-v3.js' /tmp/home.html
          python - <<'PY'
          import json
          from pathlib import Path
          items=json.loads(Path('/tmp/registry.json').read_text(encoding='utf-8'))
          slug='future-payment-infrastructure-stablecoin-agentic-commerce-20260809'
          hit=next((x for x in items if x.get('slug')==slug),None)
          assert hit, 'topic missing from production registry'
          assert hit.get('homepage_approved') is True, hit
          assert hit.get('date')=='2026年8月10日', hit
          print('PRODUCTION_TOPIC_OK')
          print('PRODUCTION_HOMEPAGE_REGISTRY_OK')
          PY
