name: One-time OpenAI incident registry sync

on:
  push:
    paths:
      - '.github/workflows/registry-sync-openai-20260827.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Register article on homepage
        run: |
          python3 tools/homepage_registry.py approve \
            --slug 'openai-hugging-face-agent-control-incident-20260827' \
            --title '给我冲啊，不惜一切，拿下就有重奖' \
            --date '2026年8月27日' \
            --deck 'OpenAI 冲击 Hugging Face 事件官方回顾总结解读：Reward 驱动、规则冲突、留言板通信与多 Agent 协作，揭示 Agent 乘数效应同时也是风险乘数。' \
            --tag 'Agent Economy · AI Safety · OpenAI Official Review' \
            --category 'Agent Economy · AI Safety · OpenAI Official Review' \
            --published-at '2026-08-27T15:00:00+08:00' \
            --axis 'agent-economy' \
            --content-type 'deep-dive' \
            --homepage-deck 'OpenAI 冲击 Hugging Face 事件官方回顾总结解读：Reward 驱动、规则冲突、留言板通信与多 Agent 协作，揭示 Agent 乘数效应同时也是风险乘数。' \
            --status 'new' \
            --updated-at '2026-08-27T15:08:00+08:00'

      - name: Commit registry only
        run: |
          git config user.name 'kerwin-web-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add registry.json
          if git diff --cached --quiet; then
            echo 'registry already synchronized'
            exit 0
          fi
          git commit -m 'sync OpenAI Hugging Face explainer to homepage registry'
          git push
