name: One-off final HF editorial scan
on:
  push:
    paths:
      - '.github/workflows/oneoff-final-hf-editorial-scan.yml'
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Remove final editorial residue
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('huggingface-open-model-market-20260904/index.html')
          s=p.read_text()
          a='哪些协同已经发生，哪些只是漂亮故事？NIM反而提醒我们不要强行闭环'
          b='哪些协同已经发生，哪些仍只是推演？NIM提示：不能强行闭环'
          if a not in s: raise SystemExit('target heading missing')
          s=s.replace(a,b)
          forbidden=['你的类比成立','先别介绍HF','以后研究Provider','你在哪些交易场所挂牌','这说明我们必须','最值得写进本文','这里OpenRouter的价值','提醒我们不要强行闭环']
          remain=[x for x in forbidden if x in s]
          if remain: raise SystemExit('residue remains '+repr(remain))
          p.write_text(s)
          print('final editorial residue scan: PASS')
          PY
      - name: Remove workflow and commit
        run: |
          rm .github/workflows/oneoff-final-hf-editorial-scan.yml
          git config user.name 'kerwin-research-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add huggingface-open-model-market-20260904/index.html .github/workflows/oneoff-final-hf-editorial-scan.yml
          git commit -m 'Remove final conversational residue from HF article'
          git push
