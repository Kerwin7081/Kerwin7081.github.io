name: Fix SpaceX Euphemism Once
on:
  push:
    paths:
      - '.github/workflows/fix-spacex-euphemism-once.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix non-country wording
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('spacex-product-system-20260816/index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('某东方超级大国投资人一眼能理解的量级','中文投资人一眼能理解的量级')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit cleanup and remove workflow
        run: |
          git config user.name kerwin
          git config user.email kerwin7081@gmail.com
          git add spacex-product-system-20260816/index.html
          git rm .github/workflows/fix-spacex-euphemism-once.yml
          git commit -m "Fix SpaceX euphemism wording context"
          git push
