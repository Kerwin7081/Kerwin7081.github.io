name: Sync registry overlay

on:
  push:
    branches:
      - main
    paths:
      - registry-pending.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: registry-overlay-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Merge pending metadata into registry
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          registry_path = Path('registry.json')
          pending_path = Path('registry-pending.json')
          registry = json.loads(registry_path.read_text(encoding='utf-8'))
          pending = json.loads(pending_path.read_text(encoding='utf-8'))
          if not isinstance(registry, list) or not isinstance(pending, list):
              raise SystemExit('registry and pending files must both be arrays')

          by_slug = {item.get('slug'): i for i, item in enumerate(registry) if isinstance(item, dict) and item.get('slug')}
          additions = []
          for item in pending:
              if not isinstance(item, dict) or not item.get('slug'):
                  continue
              slug = item['slug']
              if slug in by_slug:
                  registry[by_slug[slug]] = item
              else:
                  additions.append(item)

          additions.sort(key=lambda x: x.get('published_at', ''), reverse=True)
          registry = additions + registry
          registry_path.write_text(json.dumps(registry, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Validate pending catalog entries
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          pending = json.loads(Path('registry-pending.json').read_text(encoding='utf-8'))
          axes = {'physical-infrastructure','compute-chain','agent-economy','capital-macro','frontier-infrastructure'}
          content_types = {'earnings','deep-dive','brief','interactive','tracker'}
          required = ('slug','title','date','deck','tag','published_at','axis','content_type')
          errors = []
          for item in pending:
              if not isinstance(item, dict):
                  errors.append('pending item must be an object')
                  continue
              slug = item.get('slug') or '<missing-slug>'
              for field in required:
                  if not item.get(field):
                      errors.append(f'{slug}: missing {field}')
              if item.get('axis') not in axes:
                  errors.append(f"{slug}: invalid axis {item.get('axis')!r}")
              if item.get('content_type') not in content_types:
                  errors.append(f"{slug}: invalid content_type {item.get('content_type')!r}")
              if item.get('homepage_approved') is True:
                  path = Path(item.get('path', slug)).as_posix().strip('/')
                  candidates = [Path(path), Path(path) / 'index.html']
                  if not any(candidate.is_file() for candidate in candidates):
                      errors.append(f'{slug}: public path does not exist')
          if errors:
              raise SystemExit('\n'.join('ERROR: ' + e for e in errors))
          print(f'pending catalog valid: {len(pending)} entries')
          PY

      - name: Sync Vinext no-JS catalog fallbacks
        run: python3 tools/sync_homepage_fallback.py

      - name: Verify Vinext no-JS catalog fallbacks
        run: python3 tools/sync_homepage_fallback.py --check

      - name: Rebuild sitemap
        run: python3 tools/build_sitemap.py

      - name: Commit registry update
        run: |
          if git diff --quiet -- registry.json sitemap.xml index.html library/index.html; then
            echo "registry already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add registry.json sitemap.xml index.html library/index.html
          git commit -m "Sync published registry, fallbacks and sitemap"
          git push
