name: One-off HF market map patch
on:
  push:
    paths:
      - '.github/workflows/oneoff-hf-market-map-patch.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch article, registry and homepage fallback
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          article = Path('huggingface-open-model-market-20260904/index.html')
          text = article.read_text(encoding='utf-8')
          marker = 'open-model-economy-kerwin-20260904.svg'
          if marker not in text:
              needle = '<p>但边界正在靠近：HF已经通过Inference Providers提供统一API、自动Provider选择、Failover与集中Billing；OpenRouter则不断加强Model Discovery、Analytics、Routing、Cost Management与市场数据。HF正在向交易市场下沉，OpenRouter正在向AI Model Exchange上升。</p>\n    </section>'
              figure = '''<p>但边界正在靠近：HF已经通过Inference Providers提供统一API、自动Provider选择、Failover与集中Billing；OpenRouter则不断加强Model Discovery、Analytics、Routing、Cost Management与市场数据。HF正在向交易市场下沉，OpenRouter正在向AI Model Exchange上升。</p>\n      <figure style="margin:30px 0 4px;padding:18px;border:1px solid var(--line2);background:#fff;box-shadow:0 8px 24px rgba(68,49,37,.08)">\n        <img src="/assets/open-model-economy-kerwin-20260904.svg" alt="Kerwin Open Model Economy：从模型发行、Hugging Face、Inference Provider、OpenRouter、DGX Cloud Lepton到NVIDIA GPU、Token与Useful Work的市场结构图" style="display:block;width:100%;height:auto">\n        <figcaption style="margin-top:12px;color:var(--muted);font-size:12px;line-height:1.6"><b style="color:var(--green)">图｜Kerwin Open Model Economy</b>　模型发行人 → Hugging Face → Inference Provider → OpenRouter → GPU Cloud → DGX Cloud Lepton → NVIDIA GPU → Token / Agent → Useful Work。该图是本文资本市场类比与 Kerwin AI Control Plane 研究的母图。</figcaption>\n      </figure>\n    </section>'''
              if needle not in text:
                  raise SystemExit('article insertion point not found')
              text = text.replace(needle, figure, 1)
              article.write_text(text, encoding='utf-8')

          registry_path = Path('registry.json')
          registry = json.loads(registry_path.read_text(encoding='utf-8'))
          for page in registry:
              if page.get('slug') == 'huggingface-open-model-market-20260904':
                  page['title'] = '开源模型军团出海：英伟达130亿美元抢占桥头堡'
                  page['deck'] = '从DeepSeek时刻到Qwen生态，精细拆解Hugging Face作为开源模型发行、托管、衍生、部署与开发者分发基础设施的行业地位；比较OpenRouter、Inference Provider与DGX Cloud Lepton，并推演英伟达约130亿美元收购HF后的AI Demand Graph、Compute Demand与Control Plane价值。'
                  page['homepage_deck'] = 'DeepSeek打开缺口，Qwen 15.1万+衍生仓库证明开源模型已形成生态。Hugging Face负责模型发行、托管与开发者分发，OpenRouter负责Token交易与Provider路由，Lepton聚合GPU供给；英伟达约130亿美元买下的是开源模型全球分发桥头堡、一张18M+开发者Demand Graph与AI Control Plane。'
                  page['category'] = 'Open-Source Model Economy · AI Control Plane'
                  page['updated_at'] = '2026-09-04T14:15:00+08:00'
                  break
          else:
              raise SystemExit('registry entry not found')
          registry_path.write_text(json.dumps(registry, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          home = Path('index.html')
          home_text = home.read_text(encoding='utf-8')
          home_text = home_text.replace('模型从哪里“上市”：Hugging Face、OpenRouter 与开放 AI 的新市场结构', '开源模型军团出海：英伟达130亿美元抢占桥头堡')
          home.write_text(home_text, encoding='utf-8')
          PY
      - name: Self-remove and commit
        run: |
          rm -f .github/workflows/oneoff-hf-market-map-patch.yml
          git config user.name "kerwin-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git add huggingface-open-model-market-20260904/index.html registry.json index.html .github/workflows/oneoff-hf-market-map-patch.yml
          git commit -m "Insert Open Model Economy map and sync HF article metadata"
          git push
