name: Polish Frontier Model Economics 1.0

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/polish-frontier-model-1-0.yml

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Remove internal-discussion phrasing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          page = Path('frontier-model-economics-1-0-20260901/index.html')
          text = page.read_text(encoding='utf-8')
          replacements = {
            '本文是《模型公司上市元年》之后的方法论沉淀，不重复六家公司估值表。': '本文承接《模型公司上市元年》的财务锚点，不重复六家公司估值表。',
            '这轮讨论真正改变了什么': '从财务事实到统一经济学',
            '起点是智谱、MiniMax 两份财报：收入高速增长，但推理仍是可变成本，研发强度仍远高于成熟 SaaS。沿着这条损益表往下追，我们最终发现，模型公司的核心问题并不是“谁最聪明”，而是“谁能以最低的资本与算力，把智能转化为最多成功任务，并把任务价值留在自己的股东账上”。': '智谱、MiniMax 两份财报提供了关键财务起点：收入高速增长，但推理仍是可变成本，研发强度仍远高于成熟 SaaS。沿着损益表继续追踪，模型公司的核心问题逐渐清晰：谁能以最低的资本与算力，把智能转化为最多成功任务，并把任务价值留在自己的股东账上。',
            '这轮讨论最终把原先分散的 1GW AI Factory、Token Economy、Agent Hour 与模型公司财务装进同一个生产函数。': '由此可以把原本分散的 1GW AI Factory、Token Economy、Agent Hour 与模型公司财务装进同一个生产函数。',
            '这轮讨论中最重要的投资修正之一，是把“模型作者”和“Token 生产商”拆开。': '投资分析必须把“模型作者”和“Token 生产商”拆开。',
            '1.0 之后，研究从哪里继续': '1.0 的下一组验证变量',
            'Provider 作为独立赛道另开研究分支，分析 GPU Hour 如何被加工成稳定、低延迟、低成本 Token，以及这一层利润率如何形成。': '把 Provider 视为独立的 Inference Manufacturing 层，分析 GPU Hour 如何被加工成稳定、低延迟、低成本 Token，以及这一层利润率如何形成。',
            '这篇 1.0 不是对聊天过程的整理，而是一次研究操作系统的升级：把公开财报、算力生产函数、数字劳动力、任务市场、路由分发与价值捕获放到同一张可证伪账本中。后续新增数据应优先填入指标，而不是继续堆叠概念。': 'Frontier Model Economics 1.0 把公开财报、算力生产函数、数字劳动力、任务市场、路由分发与价值捕获放到同一张可证伪账本中。未来新增数据将优先对应到可验证指标，以持续检验和修正这套框架。'
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'missing expected phrase: {old}')
              text = text.replace(old, new)
          text = text.replace('Updated 2026-09-01 15:39 HKT', 'Updated 2026-09-01 16:20 HKT')
          page.write_text(text, encoding='utf-8')

          meta_path = Path('frontier-model-economics-1-0-20260901/meta.json')
          meta = json.loads(meta_path.read_text(encoding='utf-8'))
          meta['updated_at'] = '2026-09-01T16:20:00+08:00'
          meta_path.write_text(json.dumps(meta, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Commit polished public copy
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontier-model-economics-1-0-20260901/index.html frontier-model-economics-1-0-20260901/meta.json
          git commit -m "Polish Frontier Model Economics 1.0 public copy"
          git push
