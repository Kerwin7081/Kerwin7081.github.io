name: One-off polish Open Model SVG
on:
  push:
    paths:
      - '.github/workflows/oneoff-polish-open-model-svg.yml'
permissions:
  contents: write
jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Polish and validate SVG
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          p=Path('assets/open-model-economy-kerwin-20260904.svg')
          s=p.read_text()
          reps={
            'MODEL MARKET INFRASTRUCTURE':'MODEL INFRASTRUCTURE',
            '<text x="620" y="526" text-anchor="middle" class="cap">MODEL DISTRIBUTION｜模型分发与生态扩散</text>':'<text x="400" y="526" text-anchor="middle" class="cap">MODEL DISTRIBUTION｜模型分发与生态扩散</text>',
            '<text x="605" y="712" text-anchor="middle" class="cap">INFERENCE MARKET｜模型推理市场</text>':'<text x="400" y="712" text-anchor="middle" class="cap">INFERENCE MARKET｜模型推理市场</text>',
            '<text x="605" y="920" text-anchor="middle" class="cap">TOKEN ORDER｜Token订单分发</text>':'<text x="420" y="920" text-anchor="middle" class="cap">TOKEN ORDER｜Token订单分发</text>'
          }
          for a,b in reps.items():
              if a not in s: raise SystemExit('missing '+a)
              s=s.replace(a,b)
          p.write_text(s)
          ET.parse(p)
          print('SVG XML validation and layout patch: PASS')
          PY
      - name: Remove one-off workflow and commit
        run: |
          rm .github/workflows/oneoff-polish-open-model-svg.yml
          git config user.name 'kerwin-research-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add assets/open-model-economy-kerwin-20260904.svg .github/workflows/oneoff-polish-open-model-svg.yml
          git commit -m 'Polish Open Model Economy SVG layout'
          git push
