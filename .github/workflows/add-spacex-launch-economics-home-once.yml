name: Add SpaceX Launch Economics and Homepage Once
on:
  push:
    paths:
      - '.github/workflows/add-spacex-launch-economics-home-once.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add launch economics, Starmind linkage and homepage registry
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, re
          page=Path('spacex-product-system-20260816/index.html')
          s=page.read_text(encoding='utf-8')

          # User-visible wording preference for this publication.
          s=s.replace('中国', '某东方超级大国')

          section='''<section class="section" id="launch-economics"><div class="section-label">02B · Cost to Orbit / Deployment Economics</div><h2>真正改变商业模式的，不只是“能不能发”，而是每公斤入轨成本</h2><p class="lead">火箭总报价很容易误导。对 Starlink、Starshield 和未来 Starmind（轨道 AI 算力）真正关键的指标，是 <b>Cost to Orbit（单位入轨成本）：把 1kg 有效载荷送到 LEO（近地轨道）需要多少钱。</b>当这个数字从每公斤上万美元降到几千美元，再进一步降到几百美元，太空产业会从“每一公斤都必须极度珍惜”，转向“可以批量部署服务器、太阳能板、散热器和备份冗余”的工业逻辑。</p><div class="evidence-grid"><div class="evidence"><strong>$18,500/kg</strong><span>NASA 口径的 1970–2000 历史行业平均入轨成本，SpaceX 招股材料引用。</span></div><div class="evidence"><strong>$2,700/kg</strong><span>Falcon 9（猎鹰9号）首代公开成本基准；较历史平均下降约85%。</span></div><div class="evidence"><strong>$1,400/kg</strong><span>Falcon Heavy（重型猎鹰）首代公开成本基准；较历史平均下降约92%。</span></div><div class="evidence"><strong>≤$185/kg</strong><span><span class="wine">Starship 公司长期目标</span>：相对 $18,500/kg 历史平均降低99%+。目标，不是今天已实现成本。</span></div></div><h3>行业坐标：今天没有一个可信的“全球平均”，只能看同轨道、同满载假设下的公开基准</h3><div class="table-wrap"><table><thead><tr><th>运载体系</th><th>公开成本 / 价格坐标</th><th>口径</th><th>怎么理解</th></tr></thead><tbody><tr><td><b>历史行业平均</b></td><td><b>$18,500/kg</b></td><td>NASA 1970–2000 历史平均，SpaceX SEC引用</td><td>传统一次性航天时代的长期成本坐标。</td></tr><tr><td><b>Falcon 9（猎鹰9号）</b></td><td><b>$2,700/kg</b></td><td>NASA / SpaceX 首代公开基准</td><td>复用把行业成本曲线第一次压到约历史均值的15%。当前内部边际成本可能更低，但公司未公开。</td></tr><tr><td><b>Falcon Heavy（重型猎鹰）</b></td><td><b>$1,400/kg</b></td><td>NASA / SpaceX 首代公开基准</td><td>大载荷摊薄单位成本，但任务轨道与复用方式会改变真实经济性。</td></tr><tr><td><b>某东方超级大国 · 长征2C</b></td><td><b>约 $10,800/kg</b></td><td>公开第三方报价 $30.8M ÷ LEO最大载荷2,850kg 的理论满载值</td><td>不是该国全部火箭的“平均成本”，也不代表政府内部真实成本；只是透明可复核的现役型号价格坐标。</td></tr><tr><td><b>俄罗斯 · Soyuz-2.1b（联盟2.1b）</b></td><td><b>约 $6,100/kg</b></td><td>公开商业价格约$50M ÷ LEO 8,200kg 的第三方整理坐标</td><td>当前商业可得性受地缘政治影响，更多用于理解传统中型一次性运载成本量级。</td></tr><tr><td><b>Starship（星舰）</b></td><td><b class="wine">≤$185/kg 目标</b></td><td>SpaceX 目标：比 $18,500/kg 历史平均低99%+</td><td>这是决定下一代大规模太空工业能否成立的关键变量之一；当前仍需由完全快速复用和高频发射证明。</td></tr></tbody></table></div><div class="callout"><b>为什么不直接给“2026行业平均”？</b>不同火箭的轨道、最大载荷、是否复用、政府任务溢价、商业报价和内部真实成本差异很大；部分国家的真实成本还受到补贴与非公开采购影响。<b>所以本页只使用“历史行业平均 + 可复核型号基准”，不制造一个看起来精确、实际不可比的全球平均数。</b></div><h3>Starmind（轨道AI算力）为什么高度依赖这条成本曲线</h3><p>SpaceX 已公开 Starmind 的第一代 <b>AI1</b>：单星 Compute Payload（算力载荷）峰值约150kW、平均约120kW，整星 vehicle efficiency（算力/质量效率）约 <b>70kW/吨</b>。按这一参数匡算，部署 <b>1MW 平均轨道算力约需要14.3吨整星质量</b>。这让“每公斤入轨成本”直接变成太空数据中心的第一道资本开支。</p><div class="table-wrap"><table><thead><tr><th>运价坐标</th><th>1MW Starmind 等效入轨质量</th><th>仅发射环节 / MW</th><th>仅发射环节 / 1GW</th></tr></thead><tbody><tr><td>历史 $18,500/kg</td><td>约14.3吨</td><td>约 <b>$264M</b></td><td>约 <b>$264B</b></td></tr><tr><td>Falcon 9 $2,700/kg</td><td>约14.3吨</td><td>约 <b>$38.6M</b></td><td>约 <b>$38.6B</b></td></tr><tr><td>Falcon Heavy $1,400/kg</td><td>约14.3吨</td><td>约 <b>$20.0M</b></td><td>约 <b>$20.0B</b></td></tr><tr><td><b>Starship ≤$185/kg 目标</b></td><td>约14.3吨</td><td><b class="wine">约 $2.64M</b></td><td><b class="wine">约 $2.64B</b></td></tr></tbody></table></div><div class="callout"><b>这张表的意义：</b>如果仍停留在 Falcon 9 时代的成本曲线，把1GW Starmind 算力送上轨道，仅运费就可能是数百亿美元；如果 Starship 真能逼近每公斤数百美元，运费才开始从“项目杀手”变成“可管理的基础设施成本”。<b>这就是 Starship 对 Starmind 的意义：它不是运输工具，而是轨道AI的成本开关。</b></div><div class="callout"><b>但“$185/kg”也不是轨道 AI 自动成立的充分条件。</b>2026 年一项公开学术模型估计，在约40kg/kW的系统质量假设下，为了和地面数据中心竞争，<b>发射 + 航天器制造</b>合计成本大致需要落在 $250–$1,000/kg 的区间；当前 Falcon 9 的公开专用发射价格本身就高于这个区间。Starship 目标若兑现，会让“发射成本”首次落进可能闭合经济账的范围，但散热、太阳能、芯片辐射寿命、通信带宽、利用率、维修/替换周期仍然必须同时过关。</div><div class="dark-panel"><h3>Kerwin 投资框架｜运价下降改变的不是火箭利润，而是“可部署资产的种类”</h3><p><b>$18,500/kg：</b>卫星必须轻、小、贵，每公斤都要极致优化。<br><b>$2,700–$1,400/kg：</b>大规模通信星座开始可行，Starlink 得以滚动迭代。<br><b>数百美元/kg：</b>可以开始讨论更重的 V3 卫星、更大太阳能阵列、散热器、轨道服务器和冗余系统。<br><b>≤$185/kg：</b>如果同时实现快速复用和高频率，Starmind / Orbital AI Compute 才可能真正进入工业化部署阶段。</p></div><p class="transition">所以，下一节的“运力 → 卫星 → 网络 → 用户 → AI”并不是产品目录，而是一条由单位入轨成本驱动的经济链：成本越低，SpaceX 能送上去的资产越重、越多、越复杂，下游收入池才越大。</p></section>'''

          if 'id="launch-economics"' not in s:
              anchor='<section class="section" id="architecture">'
              s=s.replace(anchor, section+'\n'+anchor,1)
          else:
              s=re.sub(r'<section class="section" id="launch-economics">.*?</section>', section, s, count=1, flags=re.S)

          # Architecture / future / monitoring explicit Starmind naming.
          s=s.replace('<b>Terafab → Colossus → Grok → X</b><span>芯片制造、算力、模型、Agent、订阅、API 与分发。</span>', '<b>Terafab → Colossus → Grok → X</b><span>芯片制造、地面算力、模型、Agent、订阅、API 与分发；未来再由 Starship 打开 Starmind（轨道AI算力）。</span>')
          s=s.replace('Orbital AI Compute（轨道 AI 算力）', 'Starmind / Orbital AI Compute（轨道 AI 算力）')
          s=s.replace('Orbital AI Compute', 'Starmind / Orbital AI Compute')
          s=s.replace('Starmind / Starmind /', 'Starmind /')
          s=s.replace('接下来只盯这十五个验证点', '接下来只盯这十六个验证点')
          if '<td>Starmind / AI1</td>' not in s:
              s=s.replace('</tbody></table></div><div class="riskrow">', '<tr><td>Starmind / AI1</td><td>官方已公开AI1：120kW平均算力、70kW/吨；Gigasat Factory目标最早2027年末开始规模制造</td><td>AI1首批演示、Starship真实单位运价、每kW整星质量、散热寿命、激光回传与批量制造节奏</td></tr></tbody></table></div><div class="riskrow">',1)

          # Sources for launch economics and Starmind.
          source_anchor='<div class="source"><a href="https://www.ssc.spaceforce.mil/'
          src='''<div class="source"><a href="https://www.sec.gov/Archives/edgar/data/1181412/000162828026036936/spaceexplorationtechnologi.htm" target="_blank" rel="noopener">SpaceX SEC / IPO — Cost to Orbit</a><span>引用NASA历史平均$18,500/kg；Falcon 9约$2,700/kg、Falcon Heavy约$1,400/kg；Starship目标相对历史平均降低99%+。</span></div><div class="source"><a href="https://www.spacex.com/spacexai/starmind" target="_blank" rel="noopener">SpaceX — STARMIND / AI1</a><span>AI1平均算力120kW、峰值150kW、70kW/吨；Mass to Orbit被公司列为轨道AI三大限制因素之一；Gigasat Factory规划最早2027年末开始大规模制造。</span></div><div class="source"><a href="https://nextspaceflight.com/launches/details/7787/" target="_blank" rel="noopener">Next Spaceflight — 某东方超级大国 · 长征2C公开价格坐标</a><span>公开列示约$30.8M价格与2,850kg LEO最大载荷；本页据此计算理论满载约$10.8k/kg，仅作型号坐标。</span></div><div class="source"><a href="https://huggingface.co/datasets/juliensimon/launch-cost-to-leo" target="_blank" rel="noopener">Open-source launch-cost compilation — Soyuz-2.1b</a><span>整理Roscosmos / Starsem公开商业定价约$50M及8,200kg LEO载荷，对应约$6.1k/kg；属于第三方公开基准。</span></div><div class="source"><a href="https://arxiv.org/abs/2604.27197" target="_blank" rel="noopener">Turyshev (2026) — Orbital Data Centers: Economic Viability</a><span>模型指出，在代表性质量假设下，轨道数据中心若要对地面基础设施形成竞争力，launch + spacecraft-build成本需大致进入数百美元/kg级别；属于学术建模，不是公司指引。</span></div>'''
          if source_anchor in s and 'SpaceX SEC / IPO — Cost to Orbit' not in s:
              s=s.replace(source_anchor, src+source_anchor,1)

          s=s.replace('Updated 2026-08-17 12:33 HKT','Updated 2026-08-17 13:17 HKT')
          s=s.replace('<span><b>数据快照</b> 2026-08-17 12:33 HKT</span>','<span><b>数据快照</b> 2026-08-17 13:17 HKT</span>')
          page.write_text(s,encoding='utf-8')

          # Registry homepage sync.
          regp=Path('registry.json')
          reg=json.loads(regp.read_text(encoding='utf-8'))
          entry={
            'slug':'spacex-product-system-20260816',
            'title':'SpaceX 全产品体系：从火箭运价到 Starlink、国防与 Starmind 轨道AI',
            'date':'2026年8月17日',
            'deck':'从香港西贡巴士上的“产品太多、傻傻分不清”出发，系统梳理Falcon、Starship、Starlink、Starshield、频谱、Terafab、Cursor与Starmind，并用$18,500/kg→$2,700/kg→≤$185/kg的入轨成本曲线解释SpaceX为什么可能从火箭公司演化为通信、国防与AI基础设施平台。',
            'tag':'SpaceX · Launch Economics · AI Infrastructure',
            'category':'SpaceX Research · AI Infrastructure · Space Economy',
            'source':'enya',
            'homepage_approved':True,
            'published_at':'2026-08-17T13:17:00+08:00',
            'layout_id':'kerwin-editorial-research-v1',
            'mobile_qa_version':'1.2.0'
          }
          found=False
          for i,x in enumerate(reg):
            if x.get('slug')==entry['slug']:
              reg[i]=entry; found=True; break
          if not found: reg.append(entry)
          regp.write_text(json.dumps(reg,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Commit update and remove one-time workflow
        run: |
          git config user.name kerwin
          git config user.email kerwin7081@gmail.com
          git add spacex-product-system-20260816/index.html registry.json
          git rm .github/workflows/add-spacex-launch-economics-home-once.yml
          git commit -m "Add SpaceX launch economics Starmind framework and homepage sync"
          git push
