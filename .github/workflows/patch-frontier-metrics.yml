name: Patch Frontier Model Value Metrics

on:
  push:
    paths:
      - '.github/workflows/patch-frontier-metrics.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch investment value data section
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('frontier-model-economics-listed-labs-20260901/index.html')
          s = p.read_text(encoding='utf-8')
          start_marker = '<div class="dark-panel"><h3>除了 P/S，最值得一起看的四个简单指标</h3>'
          end_marker = '<p>如果只能选两个指标做快速投资筛选'
          start = s.find(start_marker)
          end = s.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('Target markers not found')
          replacement = r'''<div class="dark-panel"><h3>除了 P/S，把“价格、增长、单位经济、资本消耗”真正放到同一张表</h3><p>单看 P/S 只能回答市场给了多少价格。下面四组数据进一步回答：收入分母增长多快、每一美元收入留下多少毛利、为了维持智能曲线还要投入多少研发，以及累计资本已经转成多少商业化收入。所有 N/D 都表示当前缺乏足够可比的公开披露，不用媒体猜测值硬填。</p></div>
<div class="chart"><div class="chart-title"><strong>① 最新商业化增长信号</strong><span>不同公司披露周期不同；只比较方向与数量级，不机械排名</span></div><div class="bar-row"><div class="bar-label">Anthropic / Claude<small>2025YE ~$9B → Jul-26 &gt;$65B run-rate</small></div><div class="bar-track"><span class="bar-fill" style="width:100%"></span></div><div class="bar-value">&gt;+622%</div></div><div class="bar-row"><div class="bar-label">智谱 GLM<small>2026H1 revenue YoY</small></div><div class="bar-track"><span class="bar-fill" style="width:64.3%"></span></div><div class="bar-value">+399.7%</div></div><div class="bar-row"><div class="bar-label">MiniMax<small>2026H1 revenue YoY</small></div><div class="bar-track"><span class="bar-fill" style="width:45.5%"></span></div><div class="bar-value">+283.1%</div></div><div class="bar-row"><div class="bar-label">xAI / Grok<small>SpaceX AI segment 2026H1 YoY</small></div><div class="bar-track"><span class="bar-fill" style="width:21%"></span></div><div class="bar-value">+130.6%</div></div><div class="bar-row"><div class="bar-label">OpenAI / GPT<small>2025YE → Aug-26 revenue run-rate</small></div><div class="bar-track"><span class="bar-fill" style="width:16.1%"></span></div><div class="bar-value">~+100%</div></div><div class="bar-row"><div class="bar-label">DeepSeek<small>缺乏同口径历史收入</small></div><div class="bar-track"><span class="nd">N/D</span></div><div class="bar-value">N/D</div></div><div class="bar-row"><div class="bar-label">Moonshot / Kimi<small>缺乏可比公开增长口径</small></div><div class="bar-track"><span class="nd">N/D</span></div><div class="bar-value">N/D</div></div><div class="chart-note">Anthropic 与 OpenAI 使用 revenue run-rate 的跨时点变化；智谱、MiniMax 与 xAI 使用已披露同比增长，因此不能把柱长理解成严格同周期排名。它更适合回答：当前哪几家公司处在收入分母最快扩张阶段。</div></div>
<div class="two-col"><div class="chart"><div class="chart-title"><strong>② Gross Margin｜毛利率</strong><span>2026H1；只填可核验披露</span></div><div class="bar-row"><div class="bar-label">xAI / Grok<small>SpaceX AI segment；混合业务*</small></div><div class="bar-track"><span class="bar-fill" style="width:100%"></span></div><div class="bar-value">53.8%</div></div><div class="bar-row"><div class="bar-label">智谱 GLM<small>Group gross margin</small></div><div class="bar-track"><span class="bar-fill" style="width:49.1%"></span></div><div class="bar-value">26.4%</div></div><div class="bar-row"><div class="bar-label">MiniMax<small>Group gross margin</small></div><div class="bar-track"><span class="bar-fill" style="width:33.3%"></span></div><div class="bar-value">17.9%</div></div><div class="bar-row"><div class="bar-label">OpenAI / Anthropic / DeepSeek / Kimi</div><div class="bar-track"><span class="nd">N/D</span></div><div class="bar-value">N/D</div></div><div class="chart-note">* xAI 的 AI segment 包含 X 广告、订阅、数据许可、Grok API 与 AI infrastructure/cloud，53.8% 不能当作纯 Grok 模型毛利率。智谱 API 单项毛利率为 24.6%，集团为 26.4%。</div></div><div class="chart"><div class="chart-title"><strong>③ R&amp;D / Revenue｜研发强度</strong><span>2026H1；越高代表当前资本消耗越重</span></div><div class="bar-row"><div class="bar-label">MiniMax</div><div class="bar-track"><span class="bar-fill risk" style="width:100%"></span></div><div class="bar-value">~255%</div></div><div class="bar-row"><div class="bar-label">智谱 GLM</div><div class="bar-track"><span class="bar-fill risk" style="width:87.6%"></span></div><div class="bar-value">~223%</div></div><div class="bar-row"><div class="bar-label">xAI / Grok<small>SpaceX AI segment*</small></div><div class="bar-track"><span class="bar-fill risk" style="width:52.9%"></span></div><div class="bar-value">~135%</div></div><div class="bar-row"><div class="bar-label">OpenAI / Anthropic / DeepSeek / Kimi</div><div class="bar-track"><span class="nd">N/D</span></div><div class="bar-value">N/D</div></div><div class="chart-note">智谱：RMB2.131B / RMB953.9M；MiniMax：US$296.9M / US$116.6M；xAI：US$4.557B / US$3.379B。对 Frontier Model 来说，R&amp;D / Revenue 从 200%+ 持续下降而能力保持领先，才是 operating leverage（经营杠杆）真正出现的信号。</div></div></div>
<div class="chart"><div class="chart-title"><strong>④ Capital Monetization Efficiency｜资本商业化效率</strong><span>最新年化收入 / 累计可追踪融资；方向性指标</span></div><div class="bar-row"><div class="bar-label">Anthropic<small>&gt;$65B / ~$204B</small></div><div class="bar-track"><span class="bar-fill" style="width:100%"></span></div><div class="bar-value">&gt;31.9%</div></div><div class="bar-row"><div class="bar-label">智谱 GLM<small>$1.6B MaaS ARR / ≥$6.1B</small></div><div class="bar-track"><span class="bar-fill" style="width:82.1%"></span></div><div class="bar-value">~26.2%</div></div><div class="bar-row"><div class="bar-label">OpenAI / GPT<small>&gt;$40B / ~$197B</small></div><div class="bar-track"><span class="bar-fill" style="width:63.6%"></span></div><div class="bar-value">&gt;20.3%</div></div><div class="bar-row"><div class="bar-label">xAI / Grok<small>H1 AI segment annualized ~$6.8B / ~$42.7B</small></div><div class="bar-track"><span class="bar-fill" style="width:49.5%"></span></div><div class="bar-value">~15.8%</div></div><div class="bar-row"><div class="bar-label">DeepSeek<small>~$0.5B ARR / ~$7.4B latest round</small></div><div class="bar-track"><span class="bar-fill" style="width:21.3%"></span></div><div class="bar-value">~6.8%</div></div><div class="bar-row"><div class="bar-label">MiniMax<small>H1 revenue annualized ~$0.233B / ~$3.8B</small></div><div class="bar-track"><span class="bar-fill" style="width:19.1%"></span></div><div class="bar-value">~6.1%</div></div><div class="bar-row"><div class="bar-label">Moonshot / Kimi<small>公开收入口径不足</small></div><div class="bar-track"><span class="nd">N/D</span></div><div class="bar-value">N/D</div></div><div class="chart-note">这个比例不是会计意义的 ROIC：累计融资中混有股权、债务、IPO/配售等不同资本，收入分母也可能是 run-rate、ARR 或历史收入年化。它只回答一个简单问题：资本市场累计给出的资金，有多少已经开始转成当前商业化收入。</div></div>
<div class="table-wrap"><table class="evidence-table"><thead><tr><th>公司</th><th>P/S</th><th>商业化增长</th><th>Gross Margin</th><th>R&amp;D / Revenue</th><th>收入 / 累计融资</th></tr></thead><tbody><tr><td><b>OpenAI / GPT</b></td><td>&lt;21×</td><td>~+100% run-rate</td><td>N/D</td><td>N/D</td><td>&gt;20.3%</td></tr><tr><td><b>Anthropic / Claude</b></td><td>&lt;15×</td><td>&gt;+622% run-rate</td><td>N/D</td><td>N/D</td><td>&gt;31.9%</td></tr><tr><td><b>xAI / Grok</b></td><td>~37×</td><td>+130.6%</td><td>53.8%*</td><td>~135%*</td><td>~15.8%</td></tr><tr><td><b>DeepSeek</b></td><td>~148×</td><td>N/D</td><td>N/D</td><td>N/D</td><td>~6.8%</td></tr><tr><td><b>Moonshot / Kimi</b></td><td>N/D</td><td>N/D</td><td>N/D</td><td>N/D</td><td>N/D</td></tr><tr><td><b>智谱 / GLM</b></td><td>~45×</td><td>+399.7%</td><td>26.4%</td><td>~223%</td><td>~26.2%</td></tr><tr><td><b>MiniMax（财务对照）</b></td><td>~67×</td><td>+283.1%</td><td>17.9%</td><td>~255%</td><td>~6.1%</td></tr></tbody></table></div><div class="chart-note"><b>如何读这张表：</b>P/S 是价格，Revenue Growth 是分母扩张速度，Gross Margin 是当前单位经济，R&amp;D / Revenue 是智能曲线的资本消耗，Revenue/Funding 是粗略商业化效率。现阶段公开披露最完整的是智谱、MiniMax 与 SpaceX AI segment；OpenAI、Anthropic、DeepSeek、Kimi 的财务透明度仍明显不足，因此 N/D 本身也是研究结论。<br><b>来源：</b>智谱与 MiniMax 港交所中报；SpaceX 2026Q2 10-Q；OpenAI 2026-08 revenue run-rate 报道；Anthropic 2026-07 revenue run-rate 报道；DeepSeek 最新融资/ARR 报道。不同公司口径不完全同质，所有衍生比率均按披露值计算。</div>
'''
          s = s[:start] + replacement + s[end:]
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'kerwin'
          git config user.email 'kerwin7081@gmail.com'
          git add frontier-model-economics-listed-labs-20260901/index.html
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'Add quantitative Frontier Model investment value comparisons'
            git push
          fi
