name: Patch Frontier Model Value Metrics

on:
  push:
    paths:
      - '.github/workflows/patch-frontier-metrics.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch page
        run: python scripts/patch-frontier-metrics.py
      - name: Commit page update
        run: |
          git config user.name "kerwin"
          git config user.email "kerwin7081@gmail.com"
          git add frontier-model-economics-listed-labs-20260901/index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Add quantitative Frontier Model investment value comparisons"
            git push
          fi
