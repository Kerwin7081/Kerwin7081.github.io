name: Add SpaceX Terafab Once
on:
  push:
    paths:
      - '.github/workflows/add-spacex-terafab-once.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Terafab to SpaceX investor atlas
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('spacex-product-system-20260816/index.html')
          s=p.read_text()
          reps=[]
          reps.append((
          '工业壁垒、商业模式、竞争对手与价值迁移。',
          '工业壁垒、Terafab 芯片制造、商业模式、竞争对手与价值迁移。'))
          reps.append((
          'Colossus / Grok / X 是 AI 算力、模型和分发；Starship（星舰）则是下一代 V3 Broadband、V2 Mobile、月球运输与轨道 AI 算力共同依赖的上游产能开关。真正难复制的还不是任何一款单品，而是后面的复用、制造、发射场与激光网络共同组成的工业系统。',
          'Terafab / Colossus / Grok / X 分别对应 AI 芯片制造、算力、模型与分发；Starship（星舰）则是下一代 V3 Broadband、V2 Mobile、月球运输与轨道 AI 算力共同依赖的上游产能开关。真正难复制的还不是任何一款单品，而是后面的复用、制造、芯片、发射场与激光网络共同组成的工业系统。'))
          reps.append((
          '<b>Colossus → Grok → X / API</b><span>算力、模型、Agent、订阅、广告、API 与云算力。</span>',
          '<b>Terafab → Colossus → Grok → X</b><span>芯片制造、算力、模型、Agent、订阅、API 与分发。</span>'))
          reps.append((
          '<section class="section" id="ai"><div class="section-label">10 · AI Platform</div><h2>AI 要按“算力 → 模型 → Agent / 应用 → 分发”看</h2><p class="lead">xAI 并入 SpaceX 后，AI 不再是旁支。Colossus 是生产资料，Grok 是模型与产品，X 是实时信息与分发入口。</p>',
          '<section class="section" id="ai"><div class="section-label">10 · AI Platform</div><h2>AI 要按“芯片 → 算力 → 模型 → Agent / 应用 → 分发”看</h2><p class="lead">xAI 并入 SpaceX 后，AI 不再是旁支。<b>Terafab（太瓦级 AI 芯片制造计划）</b>把垂直整合继续向最上游的芯片设计与制造延伸；Colossus 是算力生产资料，Grok 是模型与产品，X 是实时信息与分发入口。</p><div class="callout"><b>Terafab（太瓦级 AI 芯片制造计划）｜当前状态：框架合作 / 开发中。</b> SpaceX 与 Tesla 于 2026 年 3 月宣布合作，长期目标是形成约 <b>1 TW/年</b> 的 compute hardware（算力硬件）制造能力；Intel 于 4 月加入并计划贡献高性能芯片设计、制造与封装能力。官方设想是在一座闭环工厂内覆盖 lithography mask design（光刻掩膜设计）、logic（逻辑芯片）、memory（存储芯片）与 advanced packaging（先进封装），并发展两类芯片：一类主要服务 Tesla 的地面边缘推理 / Optimus / 汽车，另一类针对太空环境，为 SpaceX 的 Orbital AI Compute（轨道 AI 算力）优化。<b>边界：</b>具体项目、时间表、里程碑与资本开支尚未最终确定；SpaceX 也明确表示未来仍会从第三方采购相当一部分算力硬件，因此不能把 Terafab 当成已经投产的自给自足芯片厂。</div>'))
          reps.append((
          '<tbody><tr><td><b>Compute（算力）</b></td><td>Colossus / Colossus II</td>',
          '<tbody><tr><td><b>Chip Manufacturing（芯片制造）</b></td><td><b>Terafab</b></td><td>SpaceX + Tesla 的太瓦级 AI 芯片制造计划；Intel 参与。目标覆盖掩膜、逻辑、存储与先进封装，并探索太空环境优化芯片。</td><td><span class="status road">框架合作 / 开发</span> 长期降低芯片供应约束与单位算力成本；尚未形成成熟运营收入。</td></tr><tr><td><b>Compute（算力）</b></td><td>Colossus / Colossus II</td>'))
          reps.append((
          '<p><b>Falcon / Space</b> 提供上游运输能力；<b>Starlink / Connectivity</b> 把一次性“送东西上天”转成持续月费、企业与政府收入，并形成当前主要利润池；<b>AI</b> 再把公司现金与融资能力投入算力基础设施，争夺下一轮更大的收入池。</p>',
          '<p><b>Falcon / Space</b> 提供上游运输能力；<b>Starlink / Connectivity</b> 把一次性“送东西上天”转成持续月费、企业与政府收入，并形成当前主要利润池；<b>AI</b> 再把公司现金与融资能力投入 <b>Terafab 芯片制造 + Colossus 算力基础设施</b>，争夺下一轮更大的收入池。</p>'))
          reps.append((
          '<tr><td><b>Orbital AI Compute（轨道 AI 算力卫星）</b></td>',
          '<tr><td><b>Terafab（太瓦级 AI 芯片制造计划）</b></td><td>框架合作 / 开发中</td><td>Tesla / Intel 合作、半导体制造能力、资本开支与供应链；长期目标约1TW/年算力硬件</td><td>具体厂址/项目协议、Capex、工期、首片芯片、良率与量产爬坡；在这些证据出现前不能视为成熟产能</td></tr><tr><td><b>Orbital AI Compute（轨道 AI 算力卫星）</b></td>'))
          reps.append((
          '公司真正把竞争差距拉开的，是 <b>复用 → 制造 → 发射场 → 星间激光 → 地面网关</b> 被做成一套连续运转的工业系统。',
          '公司真正把竞争差距拉开的，是 <b>复用 → 火箭/卫星/终端制造 → Terafab 芯片制造 → 发射场 → 星间激光 → 地面网关</b> 被做成一套连续运转的工业系统。'))
          reps.append((
          '<tr><td><b>Space Network（太空网络）</b></td>',
          '<tr><td><b>Chip Manufacturing（芯片制造）</b></td><td><b>Terafab</b>：SpaceX + Tesla 框架合作，Intel 参与；目标覆盖掩膜、逻辑、存储与先进封装，长期目标约1TW/年算力硬件</td><td>降低对外部 AI 芯片供应的单点依赖，并为地面与轨道 AI 设计更适配的芯片。</td><td>如果实现，SpaceX 的垂直整合会从火箭/卫星/终端进一步深入到基础芯片层；但目前仍处开发阶段，必须跟踪协议、Capex、良率与量产。</td></tr><tr><td><b>Space Network（太空网络）</b></td>'))
          reps.append((
          '<p><b>复用降低发射边际成本 → 高频发射让自有卫星快速迭代 → 星座容量与覆盖增长 → 用户/企业/政府收入扩大 → 现金流支撑更大的火箭、卫星和终端制造 → Starship 再把单位入轨容量提升 → 下一代 V3 / Mobile V2 / Orbital AI Compute 获得更低部署成本。</b></p>',
          '<p><b>复用降低发射边际成本 → 高频发射让自有卫星快速迭代 → 星座容量与覆盖增长 → 用户/企业/政府收入扩大 → 现金流支撑更大的火箭、卫星、终端与 Terafab 芯片制造 → Starship 再把单位入轨容量提升 → 下一代 V3 / Mobile V2 / Orbital AI Compute 获得更低部署成本。</b></p>'))
          reps.append((
          '<tr><td><b>AI</b></td><td>Colossus / II + Grok 4.6 + Bot / Build + X；1.4GW compute；Q1 550M X+Grok MAU。</td>',
          '<tr><td><b>AI</b></td><td>Terafab（芯片制造计划）+ Colossus / II + Grok 4.6 + Bot / Build + X；1.4GW compute；Q1 550M X+Grok MAU。</td>'))
          reps.append((
          '<tr><td>AI Compute</td><td>Colossus / Colossus II</td>',
          '<tr><td>AI Chips</td><td><b>Terafab</b></td><td>框架合作 / 开发中</td><td>逻辑、存储、先进封装；地面与未来轨道 AI 芯片</td><td>AI 的上游物理栈与未来资本效率；尚未形成成熟产能收入</td></tr><tr><td>AI Compute</td><td>Colossus / Colossus II</td>'))
          reps.append((
          '<div class="riskrow"><b>资本回报</b><span>Q2 AI 吃掉约86%的 Capex；如果 Cloud Services、Grok/企业AI 与算力利用率不能把巨大投入转化为足够的 ROIC，自由现金流和估值都会承压。</span></div>',
          '<div class="riskrow"><b>资本回报</b><span>Q2 AI 吃掉约86%的 Capex；如果 Cloud Services、Grok/企业AI 与算力利用率不能把巨大投入转化为足够的 ROIC，自由现金流和估值都会承压。</span></div><div class="riskrow"><b>Terafab 执行</b><span>目前是框架合作与长期目标，而不是成熟晶圆厂产能。若具体协议、Capex、工艺路线、良率或量产爬坡不及预期，芯片自给与轨道 AI 的成本优势假设必须下修；SpaceX 也明确仍将大量依赖第三方芯片供应。</span></div>'))
          reps.append((
          '<h2>接下来只盯这十二个验证点</h2>',
          '<h2>接下来只盯这十三个验证点</h2>'))
          reps.append((
          '<tr><td>AI / X / Grok</td><td>Grok 4.6 + Bot；Q2 1.4GW compute；Q1 550M MAU / 117M Grok-feature MAU / 6.3M paid</td>',
          '<tr><td>Terafab</td><td>SpaceX + Tesla 2026年3月宣布框架合作；Intel 4月加入；长期目标约1TW/年算力硬件</td><td>正式项目协议、厂址/Capex、工艺节点、首片芯片、良率与量产时间；是否真的出现太空环境优化芯片</td></tr><tr><td>AI / X / Grok</td><td>Grok 4.6 + Bot；Q2 1.4GW compute；Q1 550M MAU / 117M Grok-feature MAU / 6.3M paid</td>'))
          reps.append((
          'Falcon / Starship 能力、Broadband 与 Mobile 的 V 命名、Starlink / X / Grok 用户指标、轨道 AI 路线图、卫星汽车式制造与终端约20万套/周产能。',
          'Falcon / Starship 能力、Broadband 与 Mobile 的 V 命名、Starlink / X / Grok 用户指标、轨道 AI 路线图、卫星汽车式制造、终端约20万套/周产能，以及 Terafab 的 1TW/年长期目标、Tesla 框架合作、Intel 参与和“仍将大量采购第三方芯片”的风险边界。'))
          reps.append((
          '<div class="source"><a href="https://www.sec.gov/Archives/edgar/data/1181412/000162828026040610/spacexfwp.htm"',
          '<div class="source"><a href="https://www.sec.gov/Archives/edgar/data/50863/000005086326000077/q126earningsrelease.htm" target="_blank" rel="noopener">Intel — 2026 Q1 Earnings Release / SEC</a><span>Intel 官方确认其作为 strategic partner（战略合作方）加入 Terafab，并将贡献高性能芯片设计、制造与封装能力，作为 SpaceX 披露之外的独立一手交叉验证。</span></div><div class="source"><a href="https://www.sec.gov/Archives/edgar/data/1181412/000162828026040610/spacexfwp.htm"'))
          reps.append((
          '把复杂的 SpaceX 型号表整理成“运力—卫星—终端—服务—用户—财务—工业系统—AI—竞争”的投资地图。',
          '把复杂的 SpaceX 型号表整理成“运力—卫星—终端—服务—用户—财务—工业系统—Terafab 芯片—AI—竞争”的投资地图。'))
          reps.append((
          '<span>Updated 2026-08-17 10:30 HKT</span>',
          '<span>Updated 2026-08-17 11:31 HKT</span>'))
          reps.append((
          '<span><b>数据快照</b> 2026-08-17 10:30 HKT</span>',
          '<span><b>数据快照</b> 2026-08-17 11:31 HKT</span>'))
          for old,new in reps:
              c=s.count(old)
              if c != 1:
                  raise SystemExit(f'expected exactly 1 match, got {c}: {old[:100]}')
              s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Commit page and remove one-time workflow
        run: |
          git config user.name kerwin
          git config user.email kerwin7081@gmail.com
          git add spacex-product-system-20260816/index.html
          git rm .github/workflows/add-spacex-terafab-once.yml
          git commit -m "Add Terafab to SpaceX investor atlas"
          git push
