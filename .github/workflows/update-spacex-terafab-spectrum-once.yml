name: Update SpaceX Terafab Spectrum Once
on:
  push:
    paths:
      - '.github/workflows/update-spacex-terafab-spectrum-once.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Update SpaceX investor atlas
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, re

          page = Path('spacex-product-system-20260816/index.html')
          meta = Path('spacex-product-system-20260816/meta.json')
          s = page.read_text(encoding='utf-8')

          spectrum_html = '''<div id="spectrum-strategy"><h3>Spectrum Strategy：800 MHz 正在变成美国 D2D 的关键战略资产</h3><div class="evidence-grid"><div class="evidence"><strong>~100%</strong><span>FCC：Grain 获得的 800 MHz 牌照覆盖约 100% 美国人口。</span></div><div class="evidence"><strong>3,224</strong><span>覆盖县数量；不同地区约 4.85–14 MHz 频谱深度。</span></div><div class="evidence"><strong>Nov 5</strong><span>FCC 要求 Grain 在 2026-11-05 前完成卫星合作伙伴竞争遴选并向 FCC 报告结果。</span></div><div class="evidence"><strong>Dec 4</strong><span>若希望适用 FCC 明确的 D2D 建设指标，完整 D2D / secondary satellite 申请需在 2026-12-04 前提交。</span></div></div><div class="callout"><b>最新竞标动态：</b>据 Bloomberg 2026-08-20 援引知情人士报道，<b>SpaceX 与 AST SpaceMobile</b> 均表达了对 Grain Management 这批 800 MHz 牌照的兴趣；Grain 希望实现约 <b>$6B</b> 的价值，也可能采用租赁而非直接出售。报道所称“9 月首周初步报价”属于 Grain 的商业流程；<b>FCC 的正式要求是 11 月 5 日前完成卫星伙伴遴选并报备，并不是要求届时必须完成一笔 $6B 的牌照出售。</b>双方截至该报道时均未公开确认竞标。</div><div class="table-wrap"><table><thead><tr><th>项目</th><th>关键事实</th><th>投资含义</th></tr></thead><tbody><tr><td><b>频段</b></td><td>主要为 817–824 MHz Earth-to-space / 862–869 MHz space-to-Earth 的 800 MHz ESMR / Band 26 低频资产。</td><td>低频传播与终端兼容性强，更适合做全国覆盖、语音/控制与连接底座，而不是单纯追求大带宽。</td></tr><tr><td><b>SpaceX</b></td><td>若获得或长期租用，可为 Starlink Mobile 增加一层全国低频资产。</td><td>说明 SpaceX 的目标正在从“卫星补盲”继续向更完整的 hybrid satellite + terrestrial mobile network（卫星+地面混合移动网络）推进。</td></tr><tr><td><b>AST SpaceMobile</b></td><td>AST 已长期依靠 MNO 合作频谱推进 700/800 MHz D2D，并在美国推进 800 MHz 测试。</td><td>若获得控制权，可从“共享运营商频谱”进一步扩展到“控制全国低频资产”，提高战略自主性与谈判能力。</td></tr><tr><td><b>监管边界</b></td><td>FCC 明确指出这段 800 MHz ESMR 目前<b>并未自动分配给 SCS</b>。</td><td>中标/签约并不等于自动获准卫星商用；具体 D2D / SCS 方案仍需 FCC 针对干扰、链路参数与豁免逐案审批。</td></tr></tbody></table></div></div>'''

          if 'id="spectrum-strategy"' not in s:
              pat = r'(<section class="section" id="mobile">.*?)(</section>\n<section class="section" id="services">)'
              m = re.search(pat, s, flags=re.S)
              if not m:
                  raise SystemExit('mobile section anchor not found')
              mobile = m.group(1)
              mobile = mobile + spectrum_html
              s = s[:m.start()] + mobile + m.group(2) + s[m.end():]

          terafab_row = '''<tr><td><b>Semiconductor Manufacturing（半导体制造）</b></td><td><b>Terafab</b></td><td>SpaceX 与 Tesla 于 2026 年 3 月宣布合作，Intel 于 4 月加入；长期目标是形成每年约 1 TW compute hardware（算力硬件）的制造能力，并向光刻掩膜、逻辑芯片、存储芯片与先进封装纵向整合。</td><td><span class="status road">建设 / 扩张期</span>缓解 AI 芯片供应瓶颈、优化面向太空环境的芯片，并潜在降低长期 compute cost。</td></tr>'''
          if '<b>Terafab</b>' not in s:
              anchor = '<tbody><tr><td><b>Compute（算力）</b></td><td>Colossus / Colossus II</td>'
              if anchor not in s:
                  raise SystemExit('AI table anchor not found')
              s = s.replace('<tbody><tr><td><b>Compute（算力）</b></td><td>Colossus / Colossus II</td>', '<tbody>' + terafab_row + '<tr><td><b>Compute（算力）</b></td><td>Colossus / Colossus II</td>', 1)

          terafab_moat = '''<div class="callout"><b>Terafab 把工业壁垒再向上游推一层：</b>SpaceX 与 Tesla 已披露 Terafab 的长期目标是每年约 <b>1 TW compute hardware</b>，Intel 参与设计、制造与封装能力支持；2026 年 8 月双方又披露德州 Grimes County 项目初始投资约 <b>$16.8B</b>。这意味着 SpaceX 的垂直整合不再止于“火箭—卫星—终端—数据中心”，而是开始延伸到 <b>芯片设计 / 制造 / 存储 / 先进封装</b>。不过 Terafab 仍处建设与具体项目落地阶段，不能与已经运营的 Falcon、Starlink 或 Colossus 混作成熟资产。</div>'''
          if 'Terafab 把工业壁垒再向上游推一层' not in s:
              pat = r'(<section class="section" id="moat">.*?<p class="lead">.*?</p>)'
              m = re.search(pat, s, flags=re.S)
              if not m:
                  raise SystemExit('moat section anchor not found')
              s = s[:m.end()] + terafab_moat + s[m.end():]

          s = s.replace('复用 → 制造 → 发射场 → 星间激光 → 地面网关', '复用 → 制造 → Terafab 芯片 → 发射场 → 星间激光 → 地面网关')

          source_insert = '''<div class="source"><a href="https://docs.fcc.gov/public/attachments/DA-26-653A1.pdf" target="_blank" rel="noopener">FCC — T-Mobile / Grain 800 MHz Order (DA 26-653)</a><span>800 MHz 牌照范围、覆盖约100%美国人口、卫星合作伙伴公开遴选、11月5日报备、12月4日完整D2D申请以及SCS监管边界。</span></div><div class="source"><a href="https://graingp.com/grain-management-completes-acquisition-of-nationwide-800-mhz-spectrum-portfolio/" target="_blank" rel="noopener">Grain Management — Nationwide 800 MHz Portfolio</a><span>2026-08-11 完成从 T-Mobile 获得全国 Band 26 低频资产；Grain 明确将 D2D satellite services 列为潜在用途之一。</span></div><div class="source"><a href="https://www.sec.gov/Archives/edgar/data/1181412/000162828026042639/spaceexplorationtechnologi.htm" target="_blank" rel="noopener">SpaceX SEC Materials — Terafab</a><span>SpaceX / Tesla 2026年3月合作、Intel 4月加入、每年约1TW算力硬件长期目标，以及向芯片设计与制造延伸的垂直整合逻辑。</span></div><div class="source"><a href="https://www.reuters.com/business/media-telecom/spacex-says-terafab-be-built-texas-with-initial-investment-168-billion-2026-08-06/" target="_blank" rel="noopener">Reuters — Terafab Texas Project</a><span>Grimes County 项目与约 $16.8B 初始投资；用于当前建设进度与资本强度交叉验证。</span></div>'''
          if 'T-Mobile / Grain 800 MHz Order' not in s:
              pat = r'(<section class="section" id="sources">.*?)(</section>\n<section class="section" aria-labelledby="related-title">)'
              m = re.search(pat, s, flags=re.S)
              if not m:
                  raise SystemExit('sources section anchor not found')
              s = s[:m.start()] + m.group(1) + source_insert + m.group(2) + s[m.end():]

          # Update snapshot text without changing publication date.
          s = re.sub(r'数据快照</b> [^<]+', '数据快照</b> 2026-08-21 08:25 HKT', s, count=1)
          s = re.sub(r'Updated 2026-[^<]+ HKT', 'Updated 2026-08-21 08:25 HKT', s, count=1)
          page.write_text(s, encoding='utf-8')

          d = json.loads(meta.read_text(encoding='utf-8'))
          d['summary'] = '从 Falcon、Starship、Starlink、Starshield 到 SpaceXAI / Terafab，按型号代际、用户渗透、分部财务、工业壁垒、800 MHz 频谱战略、竞争与未来价值迁移建立完整的 SpaceX 投资人认知框架。'
          tags = list(d.get('tags', []))
          for tag in ['Terafab', '800 MHz', 'Spectrum Strategy', 'Direct-to-Device']:
              if tag not in tags: tags.append(tag)
          d['tags'] = tags
          d['updated_at'] = '2026-08-21T08:25:00+08:00'
          meta.write_text(json.dumps(d, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Commit update and remove one-time workflow
        run: |
          git config user.name "kerwin"
          git config user.email "kerwin7081@gmail.com"
          git add spacex-product-system-20260816/index.html spacex-product-system-20260816/meta.json
          git rm .github/workflows/update-spacex-terafab-spectrum-once.yml
          git commit -m "Add Terafab and 800 MHz spectrum strategy to SpaceX atlas"
          git push
