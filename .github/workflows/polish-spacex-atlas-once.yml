name: Polish SpaceX Atlas Once
on:
  push:
    paths:
      - '.github/workflows/polish-spacex-atlas-once.yml'
permissions:
  contents: write
jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Polish Chinese units and narrative consistency
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('spacex-product-system-20260816/index.html')
          s=p.read_text(encoding='utf-8')
          reps={
            '<strong>12.0M</strong><span>2026Q2 Starlink subscribers；Q1 10.3M。</span>':'<strong>12.0M <small>（1,200万）</small></strong><span>2026Q2 Starlink subscribers（订阅用户）；Q1 10.3M（1,030万）。</span>',
            '<strong>200K+</strong><span>Starlink Aviation 官方累计服务航班。</span>':'<strong>200K+ <small>（20万+）</small></strong><span>Starlink Aviation 官方累计服务航班。</span>',
            '<strong>21M+</strong><span>Starlink 2025 Progress Report：全年服务航空旅客人次。</span>':'<strong>21M+ <small>（2,100万+）</small></strong><span>Starlink 2025 Progress Report：全年服务航空旅客人次。</span>',
            '<strong>20M+</strong><span>2025 全年服务邮轮旅客人次。</span>':'<strong>20M+ <small>（2,000万+）</small></strong><span>2025 全年服务邮轮旅客人次。</span>',
            '<strong>7.4M</strong><span>Q1 monthly unique devices（月度独立设备），覆盖约30国。</span>':'<strong>7.4M <small>（740万）</small></strong><span>Q1 monthly unique devices（月度独立设备），覆盖约30国。</span>',
            '<strong>12M+</strong><span>2025 Progress Report：至少曾连接一次的人数；与7.4M月度设备不是同一口径。</span>':'<strong>12M+ <small>（1,200万+）</small></strong><span>2025 Progress Report：至少曾连接一次的人数；与7.4M（740万）月度设备不是同一口径。</span>',
            '<strong>132t / 908t</strong>':'<strong>132吨 / 908吨</strong>',
            '2026H1 1,041t；':'2026H1 1,041吨；',
            '<h3>四层工业能力，分别解决不同瓶颈</h3>':'<h3>五层工业能力，分别解决不同瓶颈</h3>',
          }
          for a,b in reps.items(): s=s.replace(a,b)
          old='<p class="lead">Starshield 不能简单理解成“军用版 Starlink”。它更像 SpaceX 把低轨卫星制造、光学星间链路、安全通信、感知载荷和 Falcon 高频发射能力，打包成美国国家安全空间基础设施。2026 年以来，这条业务与 U.S. Space Force（美国太空军）以及 Golden Dome（金穹顶导弹防御体系）的联系已经越来越具体。</p>'
          new='<p class="lead">Starshield 不能简单理解成“军用版 Starlink”。它更像 SpaceX 把低轨卫星制造、光学星间链路、安全通信、感知载荷和 Falcon 高频发射能力，打包成美国国家安全空间基础设施。<b>Golden Dome（金穹顶）也不是一张单独的“卫星订单”，而是规划规模约 $185B 的多层导弹防御体系：</b>从感知 / 追踪，到数据传输，再到火控与拦截。2026 年以来，SpaceX 已可验证地进入其中的 <span class="wine">发射 + 数据骨干 + 感知追踪</span>几层；本页不把它写成拦截弹供应商。</p>'
          s=s.replace(old,new)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit polish and remove one-time workflow
        run: |
          git config user.name kerwin
          git config user.email kerwin7081@gmail.com
          git add spacex-product-system-20260816/index.html
          git rm .github/workflows/polish-spacex-atlas-once.yml
          git commit -m "Polish SpaceX atlas Chinese units and Golden Dome framing"
          git push
