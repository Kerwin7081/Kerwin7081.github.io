# Canonical public-site deployment.
# Internal content-production skills and private research workflows are not stored in this repository.
name: Deploy EnyaClawd to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
  workflow_run:
    workflows:
      - Sync registry overlay
    types:
      - completed

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  qa:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout latest public site
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Run release QA gate
        run: node tools/qa_release.mjs

      - name: Verify homepage fallback is synchronized
        run: python3 tools/sync_homepage_fallback.py --check

      - name: Verify sitemap is generated from the approved registry
        run: |
          python3 tools/build_sitemap.py
          git diff --exit-code -- sitemap.xml

      - name: Run regression tests
        run: python3 -m unittest discover -s tests -p 'test_*.py'

  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    needs: qa
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout latest public site
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

