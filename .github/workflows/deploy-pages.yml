# Canonical public-site deployment.
# Internal content-production skills and private research workflows are not stored in this repository.
name: Deploy EnyaClawd to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
  workflow_run:
    workflows:
      - Sync registry overlay
    types:
      - completed

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  qa:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout latest public site
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Install media decoders for full integrity checks
        run: |
          python3 -m pip install --quiet pillow
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Download and decode-validate article artwork and audio
        run: python3 tools/prepare_art_special_media.py --deep-verify

      - name: Run release QA gate
        run: node tools/qa_release.mjs

      - name: Verify sitemap is generated from the approved registry
        run: |
          python3 tools/build_sitemap.py
          git diff --ignore-space-at-eol --ignore-blank-lines --exit-code -- sitemap.xml

      - name: Run focused regression tests
        run: |
          python3 -m unittest discover -s tests -p 'test_audit_changed_pages.py'
          python3 -m unittest discover -s tests -p 'test_homepage_registry.py'

      - name: Upload media files that passed full decode validation
        uses: actions/upload-artifact@v4
        with:
          name: art-special-media
          path: 1600-caravaggio-qinhuai-art-special/assets/
          retention-days: 1

  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    needs: qa
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout latest public site
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Download the exact media files that passed QA
        uses: actions/download-artifact@v4
        with:
          name: art-special-media
          path: 1600-caravaggio-qinhuai-art-special/assets/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
