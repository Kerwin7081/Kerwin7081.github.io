name: Cache verified public-domain Sublime artworks
on:
  push:
    paths:
      - .github/workflows/cache-sublime-artwork.yml
permissions:
  contents: write
jobs:
  cache-artworks:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download and validate original public-domain artworks
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import urllib.request, time, sys, io
          dest = Path('essays/licking-fear-echoes-of-the-sublime/assets')
          dest.mkdir(parents=True, exist_ok=True)
          files = [
            ('friedrich-wanderer.jpg','https://upload.wikimedia.org/wikipedia/commons/b/b9/Caspar_David_Friedrich_-_Wanderer_above_the_sea_of_fog.jpg'),
            ('levitan-eternal-rest.jpg','https://upload.wikimedia.org/wikipedia/commons/9/95/Levitan_nad_vech_pok28.jpg'),
            ('turner-snow-storm.jpg','https://upload.wikimedia.org/wikipedia/commons/3/30/Joseph_Mallord_William_Turner_-_Snow_Storm_-_Steam-Boat_off_a_Harbour%27s_Mouth_-_WGA23178.jpg'),
            ('levitan-vladimirka.jpg','https://upload.wikimedia.org/wikipedia/commons/b/be/Vladimirka.jpg'),
          ]
          for name, url in files:
            path=dest / name
            for attempt in range(4):
              try:
                req=urllib.request.Request(url, headers={'User-Agent':'KerwinResearchHubArtCache/1.0 (https://enyaclawd.com; editorial art image download)', 'Accept':'image/jpeg,image/*;q=0.8,*/*;q=0.5'})
                with urllib.request.urlopen(req, timeout=35) as resp:
                  data=resp.read()
                  ct=resp.headers.get('Content-Type','')
                  if not data.startswith(b'\xff\xd8\xff') or len(data)<15000:
                    raise ValueError(f'Invalid image {name}: bytes={len(data)}, content_type={ct}')
                  path.write_bytes(data)
                  print(f'OK {name}: {len(data)} bytes; content-type={ct}')
                  break
              except Exception as e:
                print(f'Attempt {attempt+1} for {name}: {e}', file=sys.stderr)
                if attempt==3: raise
                time.sleep(4*(attempt+1))
          PY
      - name: Produce optimized WebP copies for mobile readers
        shell: bash
        run: |
          python3 -m pip install --quiet --user Pillow
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          directory=Path('essays/licking-fear-echoes-of-the-sublime/assets')
          for source in sorted(directory.glob('*.jpg')):
            with Image.open(source) as im:
              im.thumbnail((1900,1900), Image.Resampling.LANCZOS)
              target=source.with_suffix('.webp')
              im.convert('RGB').save(target,'WEBP',quality=85,method=6)
              print(f'Optimized {target.name}: {target.stat().st_size} bytes / {im.size[0]}x{im.size[1]}')
          PY
      - name: Commit hosted artwork assets
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add essays/licking-fear-echoes-of-the-sublime/assets/
          git diff --cached --quiet && exit 0
          git commit -m "Cache original public-domain paintings for Sublime essay"
          git push origin HEAD:main
