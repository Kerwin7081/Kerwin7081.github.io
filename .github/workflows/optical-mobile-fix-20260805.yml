name: Optical mobile fix 20260805

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/optical-mobile-fix-20260805.yml'
      - '.github/scripts/optical_mobile_fix_20260805.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply mobile patch
        run: python .github/scripts/optical_mobile_fix_20260805.py

      - name: Commit patched page
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add innolight-global-optical-interconnect-panorama-20260801/index.html innolight-global-optical-interconnect-panorama-20260801/meta.json
          git commit -m "fix optical panorama mobile layout"
          git push origin HEAD:main
