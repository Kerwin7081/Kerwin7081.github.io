name: One-time AMD homepage registry sync

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-register-amd.yml'

permissions:
  contents: write

jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Upsert AMD research and featured ranks
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          registry_path = Path('registry.json')
          meta_path = Path('amd-system-level-turn-20260805/meta.json')
          workflow_path = Path('.github/workflows/one-time-register-amd.yml')

          registry = json.loads(registry_path.read_text(encoding='utf-8'))
          meta = json.loads(meta_path.read_text(encoding='utf-8'))
          slug = meta['slug']

          registry = [item for item in registry if item.get('slug') != slug]
          for item in registry:
              item.pop('featured_rank', None)

          entry_keys = (
              'slug', 'title', 'date', 'deck', 'tag', 'category', 'source',
              'homepage_approved', 'published_at', 'layout_id', 'mobile_qa_version'
          )
          entry = {key: meta[key] for key in entry_keys if key in meta}
          entry['featured_rank'] = 1
          registry.append(entry)

          rank_map = {
              'amd-system-level-turn-20260805': 1,
              'spacex-new-beginning-20260805': 2,
              'ai-memory-hbm-nand-cmx-20260722': 3,
          }
          for item in registry:
              rank = rank_map.get(item.get('slug'))
              if rank is not None:
                  item['featured_rank'] = rank

          registry_path.write_text(
              json.dumps(registry, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8'
          )
          workflow_path.unlink()
          PY
      - name: Commit registry sync and remove one-time workflow
        shell: bash
        run: |
          git config user.name 'Enya Research Publisher'
          git config user.email 'actions@users.noreply.github.com'
          git add registry.json .github/workflows/one-time-register-amd.yml
          git commit -m 'sync AMD system-level research to homepage'
          git push
