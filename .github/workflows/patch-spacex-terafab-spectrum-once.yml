name: Patch SpaceX Terafab and 800MHz Once
on:
  push:
    paths:
      - '.github/workflows/patch-spacex-terafab-spectrum-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch investor atlas
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, re
          p = Path('spacex-product-system-20260816/index.html')
          s = p.read_text()

          spectrum = '''<section class="section" id="spectrum800"><div class="section-label">07B · Spectrum / 800 MHz</div><h2>800 MHz：D2D 下一轮争夺，不只是“多一块频谱”</h2><p class="lead">2026年8月20日，据 Bloomberg 援引知情人士报道，<b>SpaceX 与 AST SpaceMobile</b> 都已表达对 Grain Management 手中美国 800 MHz 低频频谱组合的兴趣。Grain 在 8 月完成与 T-Mobile 的频谱交换后正式持有这批资产；报道指其要求潜在买方在 <b>9 月第一周</b>提交初步报价，并希望通过出售获得约 <b>$6B</b>，也不排除租赁。FCC 要求相关竞标流程在 <b>11 月 5 日</b>前完成。这里的 $6B 是 Grain 的目标变现水平，<b>不是已经成交的价格或官方估值</b>。</p><div class="evidence-grid"><div class="evidence"><strong>~$6B</strong><span>据报道 Grain 希望实现的出售价格；交易尚未达成。</span></div><div class="evidence"><strong>3,224</strong><span>这批 800 MHz 许可证覆盖约 3,224 个县，接近全美人口覆盖。</span></div><div class="evidence"><strong>817–824<br><small>MHz uplink</small></strong><span>800 MHz ESMR 上行范围；AST 已获准开展相关测试。</span></div><div class="evidence"><strong>862–869<br><small>MHz downlink</small></strong><span>对应下行范围；低频传播与建筑穿透能力是其战略价值核心。</span></div></div><div class="two-col"><div class="rulebox"><h3>为什么 AST 对这块频谱尤其敏感</h3><p>AST 的架构本来就强调 <b>sub-1 GHz（1GHz 以下低频）</b>与现有运营商网络协同；FCC 已授权其在美国通过合作伙伴使用 700/800 MHz 等低频开展 Supplemental Coverage from Space（SCS，太空补充覆盖）。AST 2026Q2 还明确把“共享 MNO 频谱 + 自控 MSS 频谱”作为核心频谱战略。如果拿到 Grain 的 800 MHz，全国低频资源会从“依赖合作伙伴”进一步向“部分自主控制”迁移。</p></div><div class="rulebox"><h3>为什么 SpaceX 也会抢</h3><p>SpaceX 已通过 EchoStar 交易获得 <b>65 MHz</b> D2D 相关频谱，并公开表示要把 Starlink Mobile 推向更完整的移动通信服务。800 MHz 如果进一步纳入其资产池，会增强低频覆盖与语音能力，也可能阻止 AST 获得一块极具全国价值的低频资源。SpaceX 的优势是资金、发射、卫星规模和已有频谱；但现有 Starlink D2C 体系主要工作在更高频段，若转向 800 MHz 仍需硬件与监管路径配套。</p></div></div><div class="callout"><b>监管边界非常关键：</b>Grain 获得的是 800 MHz Enhanced Specialized Mobile Radio（ESMR）频段。FCC 明确指出，该频段目前<b>并未直接列入 SCS 分配</b>，因此不能理解成“谁买到许可证，卫星马上就能商用”。FCC 暂缓处理相关 SCS 豁免，要求 Grain 确定具体 D2D 合作伙伴并提交带有明确技术参数的申请后再审。也就是说，这场竞标同时是<b>频谱资产争夺 + 卫星硬件适配 + FCC 授权能力</b>的竞争。</div><div class="dark-panel"><h3>Kerwin 投资判断：这是 AST vs SpaceX 竞争从“卫星数量”进入“频谱资产负债表”的标志</h3><p>过去比较两家公司，容易只看卫星数量、相控阵面积、发射节奏。现在真正稀缺的资源开始变成：<b>可用于普通手机直连的全国性频谱</b>。谁能长期控制更多低频、中频和 MSS 频谱，谁就更有机会从“补盲服务”升级成真正可持续扩容的天基移动网络。</p><p>对 AST 而言，800 MHz 更像<b>战略加速器</b>；对 SpaceX 而言，更像<b>继续扩张全栈控制权，同时封锁竞争对手稀缺资源</b>。最终竞标结果、融资结构、FCC 对 SCS 豁免的态度，都应进入 D2D 核心监控表。</p></div></section>'''

          if 'id="spectrum800"' not in s:
              marker = '<section class="section" id="services">'
              if marker not in s:
                  raise SystemExit('services marker not found')
              s = s.replace(marker, spectrum + '\n' + marker, 1)

          terafab = '''<section class="section" id="terafab"><div class="section-label">10A · Terafab / Foundational Chip Layer</div><h2>Terafab：SpaceX 把垂直整合继续推进到“造芯片”</h2><p class="lead">Terafab 不是另一座普通 AI 数据中心，而是 SpaceX 与 Tesla 试图把 <b>芯片设计 → Logic（逻辑芯片）→ Memory（存储）→ Advanced Packaging（先进封装）</b> 重新拉回内部控制的一项超大型制造计划。SpaceX 在 SEC 材料中把它直接定义为 AI 物理栈的最底层扩张。</p><div class="evidence-grid"><div class="evidence"><strong>&gt;$16.8B</strong><span>德州 Grimes County 第一阶段计划资本投入；2026年8月由得州政府与公司披露。</span></div><div class="evidence"><strong>1 TW / yr</strong><span>长期目标：每年生产约 1 太瓦（terawatt）级 compute hardware。</span></div><div class="evidence"><strong>Mar 2026</strong><span>SpaceX 与 Tesla 宣布 Terafab 合作框架。</span></div><div class="evidence"><strong>Apr 2026</strong><span>Intel 加入，拟贡献高性能芯片设计、制造与封装能力。</span></div></div><div class="chain"><div><small>01 Masks</small><b>光刻掩膜设计</b><span>把芯片设计与制造迭代周期往内部收。</span></div><div><small>02 Logic</small><b>逻辑芯片</b><span>面向 AI、机器人、车辆与轨道计算。</span></div><div><small>03 Memory</small><b>存储芯片</b><span>把算力瓶颈从 GPU 扩展到完整 memory stack。</span></div><div><small>04 Packaging</small><b>先进封装</b><span>逻辑、存储与封装在同一闭环工厂快速迭代。</span></div><div><small>05 Deployment</small><b>地面 + 轨道 AI</b><span>一类芯片面向 Tesla 端侧/推理，另一类计划针对太空环境优化。</span></div></div><div class="callout"><b>边界：</b>Terafab 的 1TW 年产能力是长期目标，不是今天已经投产的产能。SpaceX 同时明确表示，即使 Terafab 建成，仍预计会从第三方采购相当比例的 compute hardware。因此它更准确的定位是：<b>增加自有供给弹性、降低未来芯片短缺风险、优化特定 AI/太空芯片，并提高议价与迭代能力</b>，而不是“完全取代 NVIDIA / 外部晶圆厂”。</div><div class="dark-panel"><h3>AI 物理栈因此变成</h3><p><b>Power → Terafab → Colossus / AI Factory → Grok → Agent → X 分发 → Starship → Orbital AI Compute</b></p><p>这也是 SpaceX 投资逻辑里最值得长期跟踪的一条主线：它不是只想拥有模型，而是在把 AI 的约束条件——<b>电力、芯片、数据中心、网络、发射与轨道平台</b>——逐层变成内部可控制资产。</p></div></section>'''

          if 'id="terafab"' not in s:
              marker = '<section class="section" id="financial">'
              if marker not in s:
                  raise SystemExit('financial marker not found')
              s = s.replace(marker, terafab + '\n' + marker, 1)

          # Ensure the industrial-moat section explicitly includes Terafab.
          m = re.search(r'(<section class="section" id="moat">.*?)(</section>)', s, re.S)
          if m and 'Terafab' not in m.group(1):
              add = '<div class="callout"><b>Terafab 把工业壁垒再向上游推进一层：</b>过去 SpaceX 的垂直整合主要体现为火箭、发动机、卫星、终端和网络基础设施；Terafab 则试图把这种制造方法延伸到 AI 芯片的设计、逻辑/存储制造与先进封装。若成功，SpaceX 的“工业操作系统”将从 Transport / Network / Compute 进一步延伸到 <b>Foundational Silicon（基础芯片层）</b>。</div>'
              s = s[:m.end(1)] + add + s[m.end(1):]

          # Refresh description to reflect both additions.
          desc = 'SpaceX 投资人完整科普：从 Falcon、Starship、Starlink、Mobile、Starshield 到 SpaceXAI，覆盖型号代际、全球规模、800 MHz D2D 频谱争夺、Terafab 芯片制造、分部财务、工业壁垒、竞争与价值迁移。'
          s = re.sub(r'<meta name="description" content="[^"]*">', f'<meta name="description" content="{desc}">', s, count=1)
          p.write_text(s)

          mp = Path('spacex-product-system-20260816/meta.json')
          meta = json.loads(mp.read_text())
          meta['updated_at'] = '2026-08-21T08:19:00+08:00'
          meta['summary'] = 'SpaceX 投资人全景图谱：覆盖 Falcon、Starship、Starlink、Starshield、SpaceXAI，并新增 Grain 800 MHz 低频频谱争夺与 Terafab 芯片制造两条关键主线；把 D2D 竞争推进到频谱资产层，把 AI 垂直整合推进到基础芯片层。'
          tags = meta.get('tags', [])
          for t in ['800 MHz Spectrum','Grain Management','AST SpaceMobile','Band 26','D2D Spectrum','Terafab']:
              if t not in tags: tags.append(t)
          meta['tags'] = tags
          mp.write_text(json.dumps(meta, ensure_ascii=False, indent=2) + '\n')
          PY
      - name: Commit patch and remove one-time workflow
        run: |
          rm .github/workflows/patch-spacex-terafab-spectrum-once.yml
          git config user.name kerwin
          git config user.email kerwin7081@gmail.com
          git add spacex-product-system-20260816/index.html spacex-product-system-20260816/meta.json .github/workflows/patch-spacex-terafab-spectrum-once.yml
          git commit -m "Add Terafab and 800MHz D2D spectrum to SpaceX atlas"
          git push
