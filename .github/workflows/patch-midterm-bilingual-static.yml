name: Patch Midterm Bilingual Static Shell

on:
  push:
    paths:
      - '.github/workflows/patch-midterm-bilingual-static.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch bilingual labels
        shell: python
        run: |
          from pathlib import Path

          path = Path('us-midterm-2026-war-room/index.html')
          text = path.read_text(encoding='utf-8')

          replacements = {
              '一个持续更新的 Election Control Board：': '一个持续更新的 Election Control Board（选举控制权总览）：',
              '<a href="#senate">Senate</a>': '<a href="#senate">Senate（参议院）</a>',
              'US MIDTERM 2026 · LIVE TRACKER': 'US MIDTERM 2026 · LIVE TRACKER（实时追踪）',
              '<b>Election Day</b>': '<b>Election Day（投票日）</b>',
              '<b>Last refresh</b>': '<b>Last refresh（最近更新）</b>',
              '<b>Update mode</b>': '<b>Update mode（更新模式）</b>',
              '<b>Evidence</b>': '<b>Evidence（证据口径）</b>',
              'Days to Election Day': 'Days to Election Day（距投票日天数）',
              '01 · Election Control Board': '01 · Election Control Board（选举控制权总览）',
              'House 偏民主党，Senate 真正 Toss-Up': 'House（众议院）偏民主党，Senate（参议院）真正 Toss-Up（胜负难分）',
              '<span class="k">Election</span>': '<span class="k">Election（选举）</span>',
              '<span class="k">House market</span>': '<span class="k">House market（众议院预测市场）</span>',
              '<span class="k">Senate market</span>': '<span class="k">Senate market（参议院预测市场）</span>',
              '<span class="k">Trump approval</span>': '<span class="k">Trump approval（特朗普支持率）</span>',
              'Polymarket trader-implied price': 'Polymarket trader-implied price（交易者隐含价格）',
              'Near coin-flip; VP tie-break matters': 'Near coin-flip（接近五五开）；VP tie-break（副总统决定票）重要',
              'Reuters/Ipsos late-Aug snapshot': 'Reuters/Ipsos late-Aug snapshot（8月下旬快照）',
              '<h3>House of Representatives</h3>': '<h3>House of Representatives（众议院）</h3>',
              '<h3>U.S. Senate</h3>': '<h3>U.S. Senate（美国参议院）</h3>',
              '<p>Democratic control price</p>': '<p>Democratic control price（民主党控制权价格）</p>',
              '<span>D favored</span>': '<span>D favored（民主党占优）</span>',
              '<span>Cook: 21 Toss-Ups</span>': '<span>Cook: 21 Toss-Ups（21席胜负难分）</span>',
              '<span>Genuine Toss-Up</span>': '<span>Genuine Toss-Up（真正胜负难分）</span>',
              '<span>Cook: 6 Toss-Ups</span>': '<span>Cook: 6 Toss-Ups（6席胜负难分）</span>',
              '<b>Democrats Sweep</b>': '<b>Democrats Sweep（民主党横扫）</b>',
              '<b>Split Congress</b>': '<b>Split Congress（分裂国会）</b>',
              '<b>Republicans Sweep</b>': '<b>Republicans Sweep（共和党横扫）</b>',
              '<b>Reverse Split</b>': '<b>Reverse Split（反向分裂）</b>',
              '02 · Senate Battlefield Ledger': '02 · Senate Battlefield Ledger（参议院战场账本）',
              '35 场 Senate election': '35 场 Senate election（参议院选举）',
              '<span class="rating">Toss Up</span>': '<span class="rating">Toss Up（胜负难分）</span>',
              '<span class="rating lean">Lean D</span>': '<span class="rating lean">Lean D（偏民主党）</span>',
              'Ranked-choice + national headwind': 'Ranked-choice voting（排序选择投票）+ national headwind（全国环境逆风）',
              'Red-state expansion; tariffs/farm economy': 'Red-state expansion（红州战场扩张）；tariffs / farm economy（关税 / 农业经济）',
              'Incumbency vs anti-Trump environment': 'Incumbency（现任优势）vs anti-Trump environment（反特朗普全国环境）',
              'Critical Democratic defense': 'Critical Democratic defense（民主党关键防守席位）',
              'Brown comeback broadens path to 51': 'Brown comeback（布朗回归）拓宽民主党通往 51 席的路径',
              'Largest map expansion; follow GOP money': 'Largest map expansion（最大战场扩张）；重点跟踪 GOP money（共和党资金）',
              'High-cost Democratic defense': 'High-cost Democratic defense（高成本民主党防守战）',
              'Core Democratic pickup path': 'Core Democratic pickup path（民主党核心翻转路径）',
              'Open-seat defense currently tilts D': 'Open-seat defense（开放席位防守）目前偏民主党',
              '03 · House Battlefield': '03 · House Battlefield（众议院战场）',
              '184 Solid D、12 Likely D、9 Lean D、21 Toss-Up、7 Lean R、20 Likely R、182 Solid R': '184 Solid D（稳民主党）、12 Likely D（较可能民主党）、9 Lean D（偏民主党）、21 Toss-Up（胜负难分）、7 Lean R（偏共和党）、20 Likely R（较可能共和党）、182 Solid R（稳共和党）',
              'Tier-1 先看评级变化、候选人退出/丑闻、资金迁移、redistricting 与本地经济': 'Tier-1（一级关键战场）先看评级变化、候选人退出/丑闻、资金迁移、redistricting（选区重划）与本地经济',
              '04 · Party War & Event Timeline': '04 · Party War & Event Timeline（两党行动与事件时间线）',
              'localize vs nationalize': 'localize vs nationalize（地方化 vs 全国化）',
              '$5,000 adult payment campaign promise': '$5,000 adult payment campaign promise（每位成年人5,000美元支付竞选承诺）',
              'affordability 广告': 'affordability（生活成本）广告',
              '05 · Issue War': '05 · Issue War（议题战）',
              '<span class="name">Affordability</span>': '<span class="name">Affordability（可负担性）</span>',
              '<span class="name">Oil / Inflation</span>': '<span class="name">Oil / Inflation（油价 / 通胀）</span>',
              '<span class="name">Iran War</span>': '<span class="name">Iran War（伊朗战争）</span>',
              '<span class="name">Immigration</span>': '<span class="name">Immigration（移民）</span>',
              'Democratic national frame + weak presidential marks on living costs.': 'Democratic national frame（民主党全国叙事）+ 总统在生活成本问题上的评价偏弱。',
              'Iran war turns energy prices into election and rates transmission.': 'Iran war（伊朗战争）把能源价格连接到选举与利率传导。',
              'Foreign policy with direct household-price spillover.': 'Foreign policy（外交政策）正在直接外溢到家庭价格。',
              'Core GOP mobilization issue.': 'Core GOP mobilization issue（共和党核心动员议题）。',
              '06 · Money War': '06 · Money War（资金战）',
              'redistricting 和 incumbency infrastructure': 'redistricting（选区重划）和 incumbency infrastructure（现任议员组织基础）',
          }

          critical = [
              '01 · Election Control Board',
              '<span class="k">House market</span>',
              '<h3>House of Representatives</h3>',
              '02 · Senate Battlefield Ledger',
              '03 · House Battlefield',
              '04 · Party War & Event Timeline',
              '05 · Issue War',
              '06 · Money War',
          ]
          missing = [s for s in critical if s not in text]
          if missing:
              raise SystemExit('Critical expected strings missing; aborting: ' + repr(missing))

          changed = 0
          for old, new in replacements.items():
              if old in text:
                  text = text.replace(old, new)
                  changed += 1

          if changed < 25:
              raise SystemExit(f'Only {changed} replacement groups matched; aborting as unsafe')

          path.write_text(text, encoding='utf-8')
          print(f'Applied {changed} bilingual replacement groups')

      - name: Commit patch
        run: |
          if git diff --quiet -- us-midterm-2026-war-room/index.html; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add us-midterm-2026-war-room/index.html
          git commit -m "Add bilingual labels to midterm war room static shell"
          git push
