  <rect x="300" y="220" width="610" height="100" class="box bluep" filter="url(#shadow)"/>
  <text x="605" y="258" text-anchor="middle" class="b">DeepSeek · Qwen · Llama · Nemotron</text>
  <text x="605" y="292" text-anchor="middle" class="s">开源模型军团：模型资产的创造者</text>
