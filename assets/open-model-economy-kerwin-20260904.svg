<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1760" viewBox="0 0 1200 1760" role="img" aria-labelledby="title desc">
  <title id="title">Open Model Economy｜开源模型经济市场结构</title>
  <desc id="desc">Kerwin Research框架：从模型发行人、Hugging Face、Inference Provider、OpenRouter、GPU Cloud、DGX Cloud Lepton与NVIDIA GPU，连接到Token、Agent与Useful Work。</desc>
  <defs>
    <style>
      .bg{fill:#fffaf5}.ink{fill:#262220}.green{fill:#103f35}.muted{fill:#746b65}.paper{fill:#fff1e5}.white{fill:#fff}.greenp{fill:#e4efe9}.bluep{fill:#eef4f8}.violetp{fill:#f1edfb}.line{stroke:#968b83;stroke-width:2}.arrow{stroke:#103f35;stroke-width:5;fill:none;marker-end:url(#m)}.dash{stroke:#9a5c38;stroke-width:2;stroke-dasharray:7 7;fill:none}.box{stroke:#968b83;stroke-width:2;rx:16}.title{font:700 46px Georgia,'Times New Roman','Songti SC',serif;fill:#103f35}.subtitle{font:700 24px Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#262220}.h{font:700 28px Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#103f35}.b{font:700 22px Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#262220}.s{font:400 18px Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#746b65}.tiny{font:700 15px Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#9a5c38;letter-spacing:1px}.cap{font:700 17px Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#103f35}.num{font:700 18px Georgia,'Times New Roman',serif;fill:#fff}.brand{font:700 18px Georgia,'Times New Roman',serif;fill:#103f35}.side{font:400 16px Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#746b65}.strong{font-weight:700;fill:#262220}
    </style>
    <marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#103f35"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#6f5a49" flood-opacity=".12"/></filter>
  </defs>
  <rect width="1200" height="1760" class="bg"/>
  <rect x="0" y="0" width="1200" height="18" class="green"/>
  <text x="70" y="92" class="title">OPEN MODEL ECONOMY</text>
