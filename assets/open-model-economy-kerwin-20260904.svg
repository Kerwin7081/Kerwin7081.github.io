  <!-- Useful work -->
  <circle cx="92" cy="1640" r="22" class="green"/><text x="86" y="1647" class="num">9</text>
  <text x="132" y="1630" class="h">真实生产力</text><text x="132" y="1658" class="s">USEFUL WORK</text>
  <rect x="300" y="1588" width="610" height="104" class="box greenp" filter="url(#shadow)"/>
  <text x="605" y="1630" text-anchor="middle" class="b">Developers · Enterprises · Industries · People</text>
  <text x="605" y="1662" text-anchor="middle" class="s">Token → Agent → Useful Work → Economic Value</text>
  <text x="940" y="1627" class="side">最终检验不是模型榜单</text><text x="940" y="1652" class="side">而是任务、工时、收入与ROIC</text>

  <line x1="70" y1="1720" x2="1130" y2="1720" class="line"/>
  <text x="70" y="1746" class="brand">Kerwin Research · AI Capital Cycle</text>
  <text x="1130" y="1746" text-anchor="end" class="s">Model Distribution → Compute → Token → Useful Work</text>
