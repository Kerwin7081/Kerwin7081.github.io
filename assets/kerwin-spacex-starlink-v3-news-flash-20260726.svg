<text x="48" y="204" class="serif title ink">Starship Flight 13：</text>
<text x="48" y="256" class="serif title green">Starlink V3 首次真实部署</text>
<text x="48" y="291" class="sans subtitle green2">20颗功能卫星完成亚轨道释放与通信验证；飞船软溅落创最佳，助推器回收仍未过关。</text>
