<text x="66" y="337" class="sans meta green">ENYA · AUTOMATED INTELLIGENCE</text>
<text x="66" y="363" class="sans bodyb burg">由Enya自动化跟踪并排版呈现—Enya为香港首个OpenClaw架构打造的女性投顾Agent。</text>
<rect x="48" y="396" width="864" height="148" fill="#103F35"/>
<text x="66" y="444" class="serif section white">核心判断</text>
<text x="66" y="482" class="serif num" fill="#F4DED7">01</text><text x="114" y="482" class="sans cardtitle white">载荷链路过关</text>
<text x="66" y="513" class="sans corebody" fill="#E7F0EC">20颗V3顺利释放、短暂入网；</text><text x="66" y="533" class="sans corebody" fill="#E7F0EC">随后按计划再入。</text>
<text x="350" y="482" class="serif num" fill="#F4DED7">02</text><text x="398" y="482" class="sans cardtitle white">上级飞船大幅进步</text>
<text x="350" y="513" class="sans corebody" fill="#E7F0EC">在轨重启、热盾与软溅落完成；</text><text x="350" y="533" class="sans corebody" fill="#E7F0EC">Ship完整回传遥测。</text>
<text x="634" y="482" class="serif num" fill="#F4DED7">03</text><text x="682" y="482" class="sans cardtitle white">一级回收仍是短板</text>
<text x="634" y="513" class="sans corebody" fill="#E7F0EC">着陆燃烧仅5/13台点火；</text><text x="634" y="533" class="sans corebody" fill="#E7F0EC">Super Heavy高速撞海。</text>
<text x="48" y="603" class="serif num burg">01</text><text x="98" y="603" class="serif section green">这枚火箭，以及本次测试成绩单</text><line x1="48" y1="612" x2="912" y2="612" stroke="#CDBFB3" stroke-width="2"/>
