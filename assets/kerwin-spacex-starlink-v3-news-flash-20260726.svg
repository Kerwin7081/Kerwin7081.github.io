<text x="62" y="776" class="sans smallb white">STARSHIP FLIGHT 13 · STARBASE</text><text x="626" y="776" class="sans smallb white">STARLINK V1.5 / V2 / V3</text>
<rect x="48" y="804" width="410" height="144" fill="#FFFAF5" stroke="#CDBFB3" stroke-width="2"/>
<text x="66" y="842" class="sans cardtitle green">STARSHIP V3 系统</text>
<rect x="66" y="861" width="7" height="7" fill="#1F5A4D"/><text x="84" y="870" class="sans smallb ink">总高约124米、直径9米，两级构型</text>
<rect x="66" y="892" width="7" height="7" fill="#1F5A4D"/><text x="84" y="901" class="sans smallb ink">Super Heavy：33台Raptor 3，起飞推力约1,800万磅</text>
<rect x="66" y="923" width="7" height="7" fill="#1F5A4D"/><text x="84" y="932" class="sans smallb ink">Ship上级：6台Raptor，目标为完全、快速复用</text>
<rect x="478" y="804" width="434" height="144" fill="#DCE8E2" stroke="#103F35" stroke-width="2"/><rect x="478" y="804" width="434" height="31" fill="#103F35"/>
<text x="496" y="827" class="sans cardtitle white">FLIGHT 13 成绩单</text>
<text x="496" y="850" class="sans score ink">发射 / 分离</text><rect x="615" y="837" width="54" height="18" fill="#103F35"/><text x="642" y="851" text-anchor="middle" class="sans score white">完成</text><text x="681" y="850" class="sans score muted">33台起飞，级间分离顺利</text>
<text x="496" y="868" class="sans score ink">20颗V3释放</text><rect x="615" y="855" width="54" height="18" fill="#103F35"/><text x="642" y="869" text-anchor="middle" class="sans score white">完成</text><text x="681" y="868" class="sans score muted">全部顺利部署</text>
<text x="496" y="886" class="sans score ink">Ship在轨重启</text><rect x="615" y="873" width="54" height="18" fill="#103F35"/><text x="642" y="887" text-anchor="middle" class="sans score white">完成</text><text x="681" y="886" class="sans score muted">单台Raptor约14秒</text>
<text x="496" y="904" class="sans score ink">热盾 / 再入</text><rect x="615" y="891" width="54" height="18" fill="#103F35"/><text x="642" y="905" text-anchor="middle" class="sans score white">完成</text><text x="681" y="904" class="sans score muted">损伤较轻，姿态受控</text>
<text x="496" y="922" class="sans score ink">Ship软溅落</text><rect x="615" y="909" width="54" height="18" fill="#103F35"/><text x="642" y="923" text-anchor="middle" class="sans score white">完成</text><text x="681" y="922" class="sans score muted">完整漂浮并回传遥测</text>
<text x="496" y="940" class="sans score ink">一级着陆燃烧</text><rect x="615" y="927" width="54" height="18" fill="#9F332B"/><text x="642" y="941" text-anchor="middle" class="sans score white">未完成</text><text x="681" y="940" class="sans score muted">仅5/13台点火</text>
<text x="48" y="1009" class="serif num burg">02</text><text x="98" y="1009" class="serif section green">V3技术参数：用通俗语言理解“容量跃迁”</text><line x1="48" y1="1018" x2="912" y2="1018" stroke="#CDBFB3" stroke-width="2"/>
<rect x="48" y="1034" width="272" height="146" fill="#DCE8E2" stroke="#103F35" stroke-width="2"/><text x="64" y="1070" class="serif num green">01</text><text x="110" y="1070" class="sans cardtitle ink">1 Tbps 下行</text><text x="64" y="1100" class="sans small ink">这是单星总下载容量，不是单个用户速度。</text><text x="64" y="1120" class="sans small ink">算术上相当于1,000条1 Gbps链路，</text><text x="64" y="1140" class="sans small ink">或1万条100 Mbps链路的理论总量。</text>
<rect x="344" y="1034" width="272" height="146" fill="#FFFAF5" stroke="#CDBFB3" stroke-width="2"/><text x="360" y="1070" class="serif num green">02</text><text x="406" y="1070" class="sans cardtitle ink">160 Gbps 上行</text><text x="360" y="1100" class="sans small ink">约为V2的22倍。上传、企业回传和</text><text x="360" y="1120" class="sans small ink">网络骨干能力明显增强，缓解“下载快、</text><text x="360" y="1140" class="sans small ink">上传弱”的瓶颈。</text>
<rect x="640" y="1034" width="272" height="146" fill="#DCE8E2" stroke="#103F35" stroke-width="2"/><text x="656" y="1070" class="serif num green">03</text><text x="702" y="1070" class="sans cardtitle ink">2,048束双向波束</text><text x="656" y="1100" class="sans small ink">相当于2,048支可转向的“通信手电筒”，</text><text x="656" y="1120" class="sans small ink">可把容量更细地投向城市、航线、海域</text><text x="656" y="1140" class="sans small ink">和需求热点。</text>
<rect x="48" y="1196" width="272" height="146" fill="#DCE8E2" stroke="#103F35" stroke-width="2"/><text x="64" y="1232" class="serif num green">04</text><text x="110" y="1232" class="sans cardtitle ink">6×400 Gbps 激光</text><text x="64" y="1262" class="sans small ink">卫星之间可直接高速传数据，理论接口</text><text x="64" y="1282" class="sans small ink">总量2.4 Tbps，减少绕行地面站，形成</text><text x="64" y="1302" class="sans small ink">冗余的太空骨干网。</text>
<rect x="344" y="1196" width="272" height="146" fill="#FFFAF5" stroke="#CDBFB3" stroke-width="2"/><text x="360" y="1232" class="serif num green">05</text><text x="406" y="1232" class="sans cardtitle ink">1.2 Tbps 射频回传</text><text x="360" y="1262" class="sans small ink">Ka、E、V、W四频段协同，官方称超过</text><text x="360" y="1282" class="sans small ink">V2的8倍，用于把星上流量送往地面</text><text x="360" y="1302" class="sans small ink">网关。</text>
<rect x="640" y="1196" width="272" height="146" fill="#FFFAF5" stroke="#CDBFB3" stroke-width="2"/><text x="656" y="1232" class="serif num burg">06</text><text x="702" y="1232" class="sans cardtitle ink">约2倍太阳能发电</text><text x="656" y="1262" class="sans small ink">更大的相控阵、芯片和激光链路需要更多</text><text x="656" y="1282" class="sans small ink">电力。V3体量和功耗升级，也解释了</text><text x="656" y="1302" class="sans small ink">为何必须依赖Starship。</text>
<text x="48" y="1403" class="serif num burg">03</text><text x="98" y="1403" class="serif section green">从测试到运营：V3的未来部署路径</text><line x1="48" y1="1412" x2="912" y2="1412" stroke="#CDBFB3" stroke-width="2"/>
<line x1="92" y1="1452" x2="868" y2="1452" stroke="#1F5A4D" stroke-width="3"/>
<circle cx="92" cy="1452" r="11" fill="#9F332B"/><circle cx="351" cy="1452" r="11" fill="#103F35"/><circle cx="610" cy="1452" r="11" fill="#103F35"/><circle cx="868" cy="1452" r="11" fill="#103F35"/>
<text x="92" y="1490" text-anchor="middle" class="sans smallb burg">2026.07</text><text x="92" y="1510" text-anchor="middle" class="sans smallb ink">20颗亚轨道</text><text x="92" y="1530" text-anchor="middle" class="sans small muted">功能验证</text>
<text x="351" y="1490" text-anchor="middle" class="sans smallb green">2026下半年</text><text x="351" y="1510" text-anchor="middle" class="sans smallb ink">正式部署</text><text x="351" y="1530" text-anchor="middle" class="sans small muted">公司预期</text>
<text x="610" y="1490" text-anchor="middle" class="sans smallb green">单次上限</text><text x="610" y="1510" text-anchor="middle" class="sans smallb ink">60颗V3</text><text x="610" y="1530" text-anchor="middle" class="sans small muted">约60 Tbps</text>
<text x="868" y="1490" text-anchor="middle" class="sans smallb green">规模化阶段</text><text x="868" y="1510" text-anchor="middle" class="sans smallb ink">约20×容量</text><text x="868" y="1530" text-anchor="middle" class="sans small muted">相对F9/V2</text>
<rect x="48" y="1542" width="864" height="82" fill="#F4DED7" stroke="#9F332B" stroke-width="2"/><text x="66" y="1570" class="sans cardtitle burg">关键边界：测试部署不等于运营部署</text><text x="66" y="1596" class="sans smallb ink">Flight 13采用亚轨道轨迹，20颗卫星全部按计划烧毁。真正的商业闭环仍需完成轨道入轨、持续运营、一级可靠回收、</text><text x="66" y="1616" class="sans smallb ink">快速复用和稳定发射节奏。</text>
<text x="48" y="1679" class="serif num burg">04</text><text x="98" y="1679" class="serif section green">接下来必须验证的四个节点</text><line x1="48" y1="1688" x2="912" y2="1688" stroke="#CDBFB3" stroke-width="2"/>
<rect x="48" y="1700" width="410" height="63" fill="#FFFAF5" stroke="#CDBFB3" stroke-width="2"/><rect x="62" y="1714" width="32" height="32" fill="#103F35"/><text x="78" y="1737" text-anchor="middle" class="sans smallb white">1</text><text x="106" y="1726" class="sans cardtitle green">首批V3正式入轨</text><text x="106" y="1749" class="sans small ink">卫星进入目标轨道并持续提供服务，而非短时功能测试。</text>
<rect x="478" y="1700" width="434" height="63" fill="#FFFAF5" stroke="#CDBFB3" stroke-width="2"/><rect x="492" y="1714" width="32" height="32" fill="#103F35"/><text x="508" y="1737" text-anchor="middle" class="sans smallb white">2</text><text x="536" y="1726" class="sans cardtitle green">60颗 / 次兑现</text><text x="536" y="1749" class="sans small ink">确认Starship稳定释放完整批次，并实现约60 Tbps容量注入。</text>
<rect x="48" y="1777" width="410" height="63" fill="#FFFAF5" stroke="#CDBFB3" stroke-width="2"/><rect x="62" y="1791" width="32" height="32" fill="#103F35"/><text x="78" y="1814" text-anchor="middle" class="sans smallb white">3</text><text x="106" y="1803" class="sans cardtitle green">一级回收过关</text><text x="106" y="1826" class="sans small ink">13台着陆燃烧发动机可靠点火，走向塔架捕获和复用。</text>
<rect x="478" y="1777" width="434" height="63" fill="#FFFAF5" stroke="#CDBFB3" stroke-width="2"/><rect x="492" y="1791" width="32" height="32" fill="#103F35"/><text x="508" y="1814" text-anchor="middle" class="sans smallb white">4</text><text x="536" y="1803" class="sans cardtitle green">经济性进入正循环</text><text x="536" y="1826" class="sans small ink">生产、发射、终端与频谱审批同步，降低单位容量成本。</text>
<rect x="48" y="1864" width="864" height="116" fill="#FFFAF5" stroke="#9F332B" stroke-width="3"/><rect x="48" y="1864" width="10" height="116" fill="#9F332B"/><text x="76" y="1902" class="serif kerwin burg">Kerwin投顾解读</text>
<text x="76" y="1931" class="sans smallb ink">Flight 13降低了“真实载荷部署”和“上级飞船返回”两项核心技术风险，但尚未证明Starship的快速复用经济性。V3真正改变估值</text><text x="76" y="1951" class="sans smallb ink">逻辑的变量，是每次发射可向星座注入约60 Tbps容量，约为Falcon 9发射V2的20倍。后续应按“正式入轨→一级回收→快速复用</text><text x="76" y="1971" class="sans smallb ink">→发射频率→Starlink收入与资本效率”逐级确认，不能把一次成功测试直接等同于商业放量。</text>
<line x1="48" y1="1998" x2="912" y2="1998" stroke="#CDBFB3" stroke-width="2"/><text x="48" y="2020" class="sans small muted">来源：SpaceX / Starlink官方资料、SpaceX SEC披露、Reuters、Space.com。图片：SpaceX。</text><text x="48" y="2040" class="sans smallb ink">本文仅用于研究与信息交流，不构成投资建议。</text><text x="912" y="2040" text-anchor="end" class="sans smallb green">KERWIN · 2026</text>
</svg>