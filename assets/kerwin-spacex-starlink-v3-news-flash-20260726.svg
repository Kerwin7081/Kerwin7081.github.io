<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="960" height="2048" viewBox="0 0 960 2048" role="img" aria-labelledby="title desc">
<title id="title">SpaceX Starship首次部署20颗Starlink V3新闻简报</title>
<desc id="desc">Kerwin Research Hub新闻简报，纠正24颗传闻，介绍Starlink V1、V2 Mini和V3代际差异及Flight 13验证边界。</desc>
<defs>
  <style><![CDATA[
    .serif{font-family:"Noto Serif CJK SC","Source Han Serif SC","Songti SC",serif}
    .sans{font-family:"Noto Sans CJK SC","Source Han Sans SC","PingFang SC","Microsoft YaHei",sans-serif}
    .ink{fill:#262220}.muted{fill:#746B65}.green{fill:#103F35}.green2{fill:#1F5A4D}.burg{fill:#9F332B}.white{fill:#FFFFFF}
    .mast{font-size:31px;font-weight:700}.label{font-size:16px;font-weight:700}.small{font-size:14px}.smallb{font-size:15px;font-weight:700}
    .kicker{font-size:18px;font-weight:700}.title{font-size:47px;font-weight:700}.subtitle{font-size:22px;font-weight:700}
    .section{font-size:25px;font-weight:700}.num{font-size:30px;font-weight:700}.cardtitle{font-size:21px;font-weight:700}.body{font-size:18px}.bodyb{font-size:18px;font-weight:700}.metric{font-size:31px;font-weight:700}
  ]]></style>
  <clipPath id="launchClip"><rect x="48" y="368" width="520" height="282"/></clipPath>
  <clipPath id="v3Clip"><rect x="584" y="368" width="328" height="282"/></clipPath>
</defs>

<rect width="960" height="2048" fill="#FFF1E5"/>
<rect width="960" height="98" fill="#103F35"/>
<text x="48" y="60" class="serif mast white">KERWIN RESEARCH HUB</text>
<text x="912" y="43" text-anchor="end" class="sans label white">NEWS FLASH</text>
<text x="912" y="72" text-anchor="end" class="sans small" fill="#DCE8E2">2026.07.26 · HONG KONG</text>
<text x="48" y="126" class="sans" font-size="17" fill="#103F35">把复杂世界，整理成一张投资地图。</text>
<line x1="48" y1="142" x2="912" y2="142" stroke="#CDBFB3" stroke-width="2"/>

<text x="48" y="168" class="sans kicker burg">SPACEX × STARLINK</text>
<text x="48" y="226" class="serif title ink">不是24颗：Starship 首次部署</text>
<text x="48" y="281" class="serif title green">20颗 Starlink V3</text>
<text x="48" y="326" class="sans subtitle green2">一次成功的“亚轨道部署验证”，尚未等于正式入轨运营。</text>

<image x="48" y="368" width="520" height="282" preserveAspectRatio="xMidYMid slice" clip-path="url(#launchClip)" xlink:href="https://cdn.mos.cms.futurecdn.net/K4YAnvdnuJXgmuc9JYGo8g.jpg"/>
<image x="584" y="368" width="328" height="282" preserveAspectRatio="xMidYMid slice" clip-path="url(#v3Clip)" xlink:href="https://cdn.mos.cms.futurecdn.net/RDjev4mqb3JEUYZXU4QLyT.jpg"/>
<rect x="48" y="368" width="520" height="282" fill="none" stroke="#103F35" stroke-width="2"/>
<rect x="584" y="368" width="328" height="282" fill="none" stroke="#103F35" stroke-width="2"/>
<rect x="48" y="616" width="520" height="34" fill="#103F35"/>
<rect x="584" y="616" width="328" height="34" fill="#103F35"/>
<text x="62" y="639" class="sans smallb white">STARSHIP FLIGHT 13 · 2026.07.24</text>
<text x="598" y="639" class="sans smallb white">V1.5 / V2 / V3 体量对比</text>
<text x="48" y="677" class="sans small muted">图片：SpaceX；经 Space.com / Tom’s Hardware 转载。</text>

<rect x="48" y="696" width="864" height="84" fill="#FFFAF5" stroke="#103F35" stroke-width="2"/>
<text x="66" y="721" class="sans label green">ENYA · AUTOMATED INTELLIGENCE</text>
<text x="66" y="747" class="sans" font-size="16" fill="#262220">由Enya自动化跟踪并排版呈现</text>
<text x="66" y="771" class="sans" font-size="16" fill="#262220">Enya：香港首个由 OpenClaw 打造的女性投顾 Agent</text>

<rect x="48" y="802" width="864" height="176" fill="#103F35"/>
<text x="66" y="837" class="serif section white">核心判断</text>
<text x="66" y="884" class="serif num" fill="#F4DED7">01</text><text x="120" y="883" class="sans cardtitle white">数量纠正</text>
<text x="66" y="918" class="sans smallb" fill="#E7F0EC">官方任务是20颗V3；24颗属于Falcon</text><text x="66" y="942" class="sans smallb" fill="#E7F0EC">9常规星链批次。</text>
<text x="350" y="884" class="serif num" fill="#F4DED7">02</text><text x="404" y="883" class="sans cardtitle white">成功边界</text>
<text x="350" y="918" class="sans smallb" fill="#E7F0EC">20颗均顺利释放，但沿亚轨道飞行并</text><text x="350" y="942" class="sans smallb" fill="#E7F0EC">按计划再入烧毁。</text>
<text x="634" y="884" class="serif num" fill="#F4DED7">03</text><text x="688" y="883" class="sans cardtitle white">真正价值</text>
<text x="634" y="918" class="sans smallb" fill="#E7F0EC">首次验证V3真机部署、在轨点火、热</text><text x="634" y="942" class="sans smallb" fill="#E7F0EC">防护与软溅落链条。</text>

<text x="48" y="1042" class="serif num burg">01</text><text x="98" y="1041" class="serif section ink">为什么会出现“24颗”的混淆？</text>
<line x1="48" y1="1052" x2="912" y2="1052" stroke="#CDBFB3" stroke-width="2"/>
<rect x="48" y="1070" width="420" height="144" fill="#F4DED7" stroke="#9F332B" stroke-width="2"/>
<text x="68" y="1110" class="serif metric burg">24颗</text><text x="68" y="1144" class="sans cardtitle ink">Falcon 9 常规批次</text>
<text x="68" y="1176" class="sans smallb ink">当前由Falcon 9发射的仍是V2代际卫星；</text><text x="68" y="1199" class="sans smallb ink">近期多次任务每批约20多颗。</text>
<rect x="492" y="1070" width="420" height="144" fill="#DCE8E2" stroke="#103F35" stroke-width="2"/>
<text x="512" y="1110" class="serif metric green">20颗</text><text x="512" y="1144" class="sans cardtitle ink">Starship Flight 13</text>
<text x="512" y="1176" class="sans smallb ink">首次携带真实Starlink V3，任务目标和官方</text><text x="512" y="1199" class="sans smallb ink">披露均为20颗。</text>

<text x="48" y="1278" class="serif num green">02</text><text x="98" y="1277" class="serif section ink">Starlink 三代产品：从覆盖优先到容量密度跃迁</text>
<line x1="48" y1="1288" x2="912" y2="1288" stroke="#CDBFB3" stroke-width="2"/>
<rect x="48" y="1306" width="272" height="232" fill="#FFFAF5" stroke="#CDBFB3" stroke-width="2"/>
<text x="66" y="1342" class="sans label ink">V1 / V1.5</text><text x="66" y="1370" class="sans small muted">建网期</text><text x="66" y="1411" class="sans cardtitle ink">覆盖优先</text>
<rect x="66" y="1441" width="7" height="7" fill="#262220"/><text x="84" y="1451" class="sans smallb ink">Falcon 9 密集组网</text>
<rect x="66" y="1472" width="7" height="7" fill="#262220"/><text x="84" y="1482" class="sans smallb ink">奠定全球低轨覆盖</text>
<rect x="66" y="1503" width="7" height="7" fill="#262220"/><text x="84" y="1513" class="sans smallb ink">V1.5加入星间激光</text>
<rect x="344" y="1306" width="272" height="232" fill="#F7E7D8" stroke="#1F5A4D" stroke-width="2"/>
<text x="362" y="1342" class="sans label green">V2 MINI</text><text x="362" y="1370" class="sans small muted">增容期</text><text x="362" y="1411" class="sans cardtitle ink">约4× V1容量</text>
<rect x="362" y="1441" width="7" height="7" fill="#1F5A4D"/><text x="380" y="1451" class="sans smallb ink">Falcon 9自2023年起主力</text>
<rect x="362" y="1472" width="7" height="7" fill="#1F5A4D"/><text x="380" y="1482" class="sans smallb ink">192下行 / 144上行波束</text>
<rect x="362" y="1503" width="7" height="7" fill="#1F5A4D"/><text x="380" y="1513" class="sans smallb ink">单次发射约20多颗</text>
<rect x="640" y="1306" width="272" height="232" fill="#DCE8E2" stroke="#103F35" stroke-width="2"/>
<text x="658" y="1342" class="sans label green">V3</text><text x="658" y="1370" class="sans small muted">容量跃迁</text><text x="658" y="1411" class="sans cardtitle ink">1 Tbps 下行</text>
<rect x="658" y="1441" width="7" height="7" fill="#103F35"/><text x="676" y="1451" class="sans smallb ink">160 Gbps上行</text>
<rect x="658" y="1472" width="7" height="7" fill="#103F35"/><text x="676" y="1482" class="sans smallb ink">2,048双向波束</text>
<rect x="658" y="1503" width="7" height="7" fill="#103F35"/><text x="676" y="1513" class="sans smallb ink">Starship目标60颗/次</text>

<text x="48" y="1602" class="serif num green">03</text><text x="98" y="1601" class="serif section ink">此次任务究竟验证了什么？</text>
<line x1="48" y1="1612" x2="912" y2="1612" stroke="#CDBFB3" stroke-width="2"/>
<line x1="94" y1="1670" x2="866" y2="1670" stroke="#1F5A4D" stroke-width="3"/>
<circle cx="94" cy="1670" r="12" fill="#103F35"/><circle cx="351" cy="1670" r="12" fill="#103F35"/><circle cx="608" cy="1670" r="12" fill="#103F35"/><circle cx="866" cy="1670" r="12" fill="#9F332B"/>
<text x="94" y="1710" text-anchor="middle" class="sans smallb ink">释放20颗</text><text x="94" y="1733" text-anchor="middle" class="sans small muted">真机部署</text>
<text x="351" y="1710" text-anchor="middle" class="sans smallb ink">展开组件</text><text x="351" y="1733" text-anchor="middle" class="sans small muted">太阳翼/天线</text>
<text x="608" y="1710" text-anchor="middle" class="sans smallb ink">链路测试</text><text x="608" y="1733" text-anchor="middle" class="sans small muted">激光互联尝试</text>
<text x="866" y="1710" text-anchor="middle" class="sans smallb ink">计划再入</text><text x="866" y="1733" text-anchor="middle" class="sans small muted">亚轨道烧毁</text>

<rect x="48" y="1762" width="864" height="86" fill="#F4DED7" stroke="#9F332B" stroke-width="2"/>
<text x="66" y="1793" class="sans cardtitle burg">尚未完成的商业化验证</text>
<text x="66" y="1823" class="sans smallb ink">首次正式入轨、持续运营、Starship高频复用与单位容量成本，仍需后续任务确认；助推器本次溅落仍偏硬。</text>

<rect x="48" y="1870" width="864" height="110" fill="#FFFAF5" stroke="#9F332B" stroke-width="3"/>
<rect x="48" y="1870" width="10" height="110" fill="#9F332B"/>
<text x="76" y="1908" class="serif" font-size="27" font-weight="700" fill="#9F332B">Kerwin投顾解读</text>
<text x="76" y="1940" class="sans smallb ink">投资信号在于Starship把Starlink的扩容单位从“卫星数量”推向“每次发射可注入的Tbps容量”。</text>
<text x="76" y="1965" class="sans smallb ink">V3若按60颗/次运行，单次容量约60 Tbps，官方称较Falcon 9发射V2提升约20倍。当前仍属关键技术去风险。</text>

<line x1="48" y1="1996" x2="912" y2="1996" stroke="#CDBFB3" stroke-width="2"/>
<text x="48" y="2018" class="sans" font-size="12" fill="#746B65">来源：SpaceX Flight 13任务页；Starlink Version 3 Satellites；Space.com。</text>
<text x="48" y="2040" class="sans" font-size="12" fill="#746B65">本文仅用于研究与信息交流，不构成投资建议。</text>
<text x="912" y="2040" text-anchor="end" class="sans" font-size="12" font-weight="700" fill="#103F35">KERWIN · 2026</text>
</svg>